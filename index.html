<style>/*
VOICE: calm, warm, grown-up; premium social app polish.
IDEA: a Nordic forest morning: frosted cream glass over sage and stone.
PICTURE: the working app itself, in a phone frame.
COLOUR and TYPE: Deep Pine, Forest Moss, Sage Mist, Warm Stone, Linen, Snow (clay red only for SOS); DM Sans.
LAYOUT: one phone column centred; side caption on wide screens; full-screen on phones.
*/
:root{
  color-scheme:light;
  /* Nordic Forest — six brand shades */
  --pine:#12282A;--moss:#34564D;--sage:#A8B8A0;--stone:#B8A58D;--linen:#E8E1D5;--snow:#F7F5EF;
  --bg:#E8E1D5;--bg2:#F7F5EF;--ink:#12282A;--mute:#5B6B66;--dim:#8A948F;
  /* legacy names, remapped to the palette */
  --pink:#34564D;--violet:#A8B8A0;--cyan:#34564D;--lime:#8C7656;--amber:#8C7656;
  --red:#B4533F; /* functional only: SOS + destructive. Not a brand colour. */
  --glass:rgba(247,245,239,.62);--glass2:rgba(247,245,239,.85);--glass3:#fff;
  --stroke:rgba(18,40,42,.10);--stroke2:rgba(18,40,42,.16);
  --grad:linear-gradient(135deg,#34564D 0%,#12282A 100%);
  --grad-cool:linear-gradient(135deg,#A8B8A0,#C9D2BF);
  --glow-pink:0 0 0 1px rgba(52,86,77,.35),0 10px 30px rgba(18,40,42,.10);
  --glow-cyan:0 0 0 1px rgba(168,184,160,.7),0 10px 30px rgba(18,40,42,.08);
  --r:22px;--r-sm:14px;--blur:saturate(140%) blur(22px);
  --f-d:"DM Sans",system-ui,sans-serif;--f-b:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-b);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--cyan)}
::selection{background:rgba(52,86,77,0.4)}

/* ---------- stage & phone ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.aura i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aura i:nth-child(1){width:42vmax;height:42vmax;left:8%;top:6%;background:radial-gradient(circle,#34564D 0,transparent 65%)}
.aura i:nth-child(2){width:46vmax;height:46vmax;right:2%;top:30%;background:radial-gradient(circle,#A8B8A0 0,transparent 65%);animation-delay:-6s}
.aura i:nth-child(3){width:34vmax;height:34vmax;left:30%;bottom:-4%;background:radial-gradient(circle,#A8B8A0 0,transparent 65%);animation-delay:-11s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.side{position:fixed;left:max(4vw,24px);top:50%;transform:translateY(-50%);z-index:1;max-width:330px}
.side h1{font:700 44px/1.05 var(--f-d);margin:0 0 14px;letter-spacing:-.02em}
.side h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.side p{color:var(--mute);margin:0 0 10px;font-size:16px}
.side small{color:var(--dim);font-size:13px}
.side .reset{margin-top:14px}
@media(max-width:1000px){.side{display:none}}

.phone{position:relative;z-index:2;width:min(400px,100vw);height:min(860px,100dvh);background:linear-gradient(180deg,#F7F5EF 0%,#E8E1D5 100%);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px) and (min-height:700px){
  .phone{border-radius:48px;border:1px solid var(--stroke2);box-shadow:0 0 0 10px #12282A,0 0 0 11px rgba(18,40,42,0.056),0 40px 120px rgba(18,40,42,0.245),0 0 80px rgba(168,184,160,0.25)}
}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 15% 0%,rgba(52,86,77,0.22),transparent 70%),radial-gradient(50% 35% at 100% 30%,rgba(168,184,160,0.2),transparent 70%),radial-gradient(60% 40% at 30% 100%,rgba(52,86,77,0.13),transparent 70%)}
.statusbar{position:relative;z-index:5;height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 14px var(--f-b);color:var(--ink)}
.statusbar .ic{display:flex;gap:6px;align-items:center;opacity:.9}
#view{position:relative;z-index:1;flex:1;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:enter .32s cubic-bezier(.2,.8,.2,1)}
.screen.back-anim{animation:enterBack .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(24px)}}
@keyframes enterBack{from{opacity:0;transform:translateX(-24px)}}
.scroll-y{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 120px;scrollbar-width:none}
.scroll-y::-webkit-scrollbar{display:none}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 18px 12px;min-height:52px}
.topbar h2{font:700 22px/1.1 var(--f-d);margin:0;flex:1;letter-spacing:-.01em}
.topbar h3{font:600 17px/1.2 var(--f-b);margin:0;flex:1}
.logo{font:800 24px/1 var(--f-d);letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(52,86,77,0.5))}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;z-index:20;left:12px;right:12px;bottom:14px;height:68px;border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(247,245,239,0.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:0 10px 40px rgba(18,40,42,0.175)}
#tabbar.hide{display:none}
.tab{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:700;transition:color .2s}
.tab svg{transition:transform .25s,filter .25s}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--pink);filter:drop-shadow(0 0 8px var(--pink));transform:translateY(-1px)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;line-height:17px;text-align:center;box-shadow:0 0 10px var(--pink)}
.tab.sos{color:#fff}
.tab.sos .sosbtn{width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#D4876F,#A2462F 60%,#86331F);box-shadow:0 0 0 4px rgba(18,40,42,0.405),0 0 26px rgba(180,83,63,0.75);animation:pulse 2.6s infinite}
.tab.sos span{margin-top:2px}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(18,40,42,0.405),0 0 40px rgba(180,83,63,1.0)}}

/* ---------- glass + cards ---------- */
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:var(--r)}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card+.card{margin-top:12px}
.card.neon{border-color:rgba(52,86,77,0.5);box-shadow:var(--glow-pink)}
.card.cool{border-color:rgba(52,86,77,0.45);box-shadow:var(--glow-cyan)}
.sec{font:700 12.5px var(--f-b);color:var(--mute);margin:22px 4px 10px;letter-spacing:.01em}
.muted{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:13px}
.h-display{font:700 30px/1.08 var(--f-d);letter-spacing:-.02em;margin:0;text-wrap:balance}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.list{border-radius:var(--r);overflow:hidden;background:var(--glass);border:1px solid var(--stroke)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:left}
.item+.item{border-top:1px solid rgba(18,40,42,0.049)}
button.item:active{background:var(--glass2)}
.item .t{flex:1;font-weight:600}
.item .s{display:block;color:var(--mute);font-weight:500;font-size:13px}
hr.sep{border:0;border-top:1px solid var(--stroke);margin:16px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:800;font-size:15px;background:var(--glass2);border:1px solid var(--stroke2);transition:transform .12s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 30px rgba(52,86,77,0.4),inset 0 1px 0 rgba(18,40,42,0.245)}
.btn.cool{background:var(--grad-cool);border:0;color:#12282A;box-shadow:0 8px 26px rgba(52,86,77,0.35)}
.btn.ghost{background:transparent}
.btn.danger{background:linear-gradient(135deg,#C0644E,#A2462F);border:0;color:#fff;box-shadow:0 8px 26px rgba(180,83,63,0.4)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.icon-btn:active{transform:scale(.94)}

/* ---------- chips, badges ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.on{background:rgba(52,86,77,0.16);border-color:var(--pink);box-shadow:0 0 14px rgba(52,86,77,0.35)}
.chip.cyan.on{background:rgba(52,86,77,0.13);border-color:var(--cyan);box-shadow:0 0 14px rgba(52,86,77,0.3)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.verified{background:rgba(52,86,77,0.14);color:var(--cyan);border:1px solid rgba(52,86,77,0.5)}
.badge.parent{background:rgba(184,165,141,0.13);color:var(--lime);border:1px solid rgba(184,165,141,0.45)}
.badge.date{background:rgba(52,86,77,0.15);color:var(--pink);border:1px solid rgba(52,86,77,0.5)}
.badge.friend{background:rgba(168,184,160,0.16);color:#34564D;border:1px solid rgba(168,184,160,0.5)}
.badge.plan{background:var(--grad);color:#fff}

/* ---------- segmented ---------- */
.seg{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);gap:4px}
.seg button{flex:1;min-height:38px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--mute);transition:all .25s}
.seg button.on{color:#fff;background:var(--grad);box-shadow:0 4px 18px rgba(52,86,77,0.45)}
.seg.cool button.on{background:var(--grad-cool);color:#12282A;box-shadow:0 4px 18px rgba(52,86,77,0.4)}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:0 0 6px 4px}
.input,.textarea,.select{width:100%;min-height:50px;padding:12px 16px;border-radius:16px;background:rgba(18,40,42,0.042);border:1px solid var(--stroke);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.textarea{min-height:96px;resize:none;line-height:1.45}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.select option{background:#F7F5EF}
.input:focus,.textarea:focus,.select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(52,86,77,0.2)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:rgba(18,40,42,0.084);border:1px solid var(--stroke);transition:all .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}
.switch input:checked+i{background:var(--grad);border-color:transparent;box-shadow:0 0 14px rgba(52,86,77,0.5)}
.switch input:checked+i::after{transform:translateX(22px)}
.switch input:focus-visible+i{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- avatar / photo ---------- */
.avatar{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-d);color:#fff}
.avatar.ring{box-shadow:0 0 0 2px #E8E1D5,0 0 0 4px var(--pink),0 0 16px rgba(52,86,77,0.6)}
.avatar .on-dot{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px #E8E1D5}
.photo{position:relative;border-radius:var(--r);overflow:hidden;display:grid;place-items:center}
.photo svg.art{position:absolute;inset:0;width:100%;height:100%}

/* ---------- sheet / modal / toast ---------- */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(18,40,42,0.248);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow-y:auto;padding:10px 20px 30px;border-radius:30px 30px 0 0;background:rgba(247,245,239,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--stroke2);box-shadow:0 -20px 60px rgba(18,40,42,0.21);animation:up .34s cubic-bezier(.2,.9,.2,1)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:rgba(18,40,42,0.175);margin:0 auto 14px}
.sheet h3{font:700 20px/1.2 var(--f-d);margin:0 0 6px}
@keyframes up{from{transform:translateY(100%)}}
.modal{position:absolute;z-index:51;left:22px;right:22px;top:50%;transform:translateY(-50%);padding:22px;border-radius:26px;background:rgba(247,245,239,0.9);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:0 30px 80px rgba(18,40,42,0.21);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal h3{font:700 19px/1.25 var(--f-d);margin:0 0 8px}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.92)}}
#toasts{position:absolute;z-index:60;top:52px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;background:rgba(247,245,239,0.88);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:0 10px 30px rgba(18,40,42,0.158);animation:drop .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.good{border-color:rgba(184,165,141,0.5);box-shadow:0 0 20px rgba(184,165,141,0.2)}
.toast.warn{border-color:rgba(184,165,141,0.6)}
.toast.bad{border-color:rgba(180,83,63,0.7);box-shadow:0 0 20px rgba(180,83,63,0.3)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font:700 18px var(--f-d);margin:12px 0 6px}
.meter{height:8px;border-radius:5px;background:rgba(18,40,42,0.056);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--grad);box-shadow:0 0 10px rgba(52,86,77,0.6);transition:width .4s}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* installed-app / notch support */
.phone{padding-top:env(safe-area-inset-top)}
#tabbar{bottom:calc(14px + env(safe-area-inset-bottom))}
@media (display-mode: standalone){.statusbar{display:none}.phone{height:100dvh}}

.phone[data-bg=paper] #bg .b-wash{background:linear-gradient(180deg,#F7F5EF,#EFEAE0)}
.phone[data-bg=paper] #bg .b-pat{opacity:1;background-image:radial-gradient(rgba(52,86,77,.28) 1.2px,transparent 1.6px);background-size:16px 16px;-webkit-mask:linear-gradient(180deg,#000 0,rgba(0,0,0,.6) 70%,rgba(0,0,0,.25));mask:linear-gradient(180deg,#000 0,rgba(0,0,0,.6) 70%,rgba(0,0,0,.25))}
.phone[data-bg=paper] #bg .b-grain{opacity:.8}
/* doodle — messages & chat */
.phone[data-bg=doodle] #bg .b-wash{background:radial-gradient(70% 40% at 0% 0%,rgba(168,184,160,.35),transparent 70%),#F1EDE4}
.phone[data-bg=doodle] #bg .b-pat{opacity:1;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22132%22%20height%3D%22132%22%20viewBox%3D%220%200%20132%20132%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2334564D%22%20stroke-opacity%3D%22.2%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2210%22%20height%3D%2230%22%20rx%3D%225%22%20transform%3D%22rotate%28-18%2019%2031%29%22/%3E%3Ccircle%20cx%3D%2288%22%20cy%3D%2226%22%20r%3D%2211%22/%3E%3Cpath%20d%3D%22M60%2074c10-12%2026-12%2030%200-10%2012-26%2012-30%200z%22%20transform%3D%22rotate%28-30%2075%2074%29%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%22100%22%20r%3D%226%22/%3E%3Crect%20x%3D%22100%22%20y%3D%2288%22%20width%3D%2210%22%20height%3D%2228%22%20rx%3D%225%22%20transform%3D%22rotate%2824%20105%20102%29%22/%3E%3Cpath%20d%3D%22M40%20120c6-7%2015-7%2018%200-6%207-15%207-18%200z%22%20transform%3D%22rotate%2820%2049%20120%29%22/%3E%3C/g%3E%3C/svg%3E");background-size:132px 132px}
/* ripple — safety */
.phone[data-bg=ripple] #bg .b-wash{background:radial-gradient(60% 35% at 50% 30%,rgba(180,83,63,.10),transparent 70%),linear-gradient(180deg,#F7F5EF,#EDE7DC)}
.phone[data-bg=ripple] #bg .b-ring{opacity:1}
/* stone — me, settings, parents, plans */
.phone[data-bg=stone] #bg .b-pat{opacity:.55;background:var(--topo) center/cover no-repeat}
.phone[data-bg=stone] #bg .b-wash{background:radial-gradient(80% 45% at 100% 0%,rgba(184,165,141,.5),transparent 70%),radial-gradient(70% 45% at 0% 100%,rgba(168,184,160,.45),transparent 70%),#F3EFE7}
.phone[data-bg=stone] #bg .b-mark{opacity:.16}
.phone[data-bg=stone] #bg .b-circ{opacity:.8;background:#A8B8A0;top:auto;bottom:-120px;right:auto;left:-90px}
.phone::before{display:none}
@media(prefers-reduced-motion:reduce){#bg>i{animation:none!important}}
/* real phones already have a status bar: show the fake one only in the desktop phone frame */
@media (max-width:519px),(max-height:699px),(pointer:coarse){.statusbar{display:none}.phone{padding-top:max(env(safe-area-inset-top),10px)}}

/* discover.css */
/* discover + profile — all selectors prefixed .dsc- */
.dsc-root{padding-bottom:106px}
.dsc-pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 10px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--pine)}
.dsc-pill svg{color:var(--moss)}
.dsc-pill .meter{width:30px;height:5px}
.dsc-pill.low{border-color:rgba(184,165,141,0.6)}
.dsc-pill.zero{border-color:rgba(180,83,63,0.7)}
.dsc-pill.zero svg{color:var(--red);filter:none}
.dsc-top{padding:0 18px 8px}
.dsc-banners{display:flex;gap:8px;padding:0 18px;flex-wrap:wrap}
.dsc-banners:empty{display:none}
.dsc-ban{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;margin-top:8px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(52,86,77,0.12);border:1px solid rgba(52,86,77,0.35);color:var(--moss)}
.dsc-ban.lime{background:rgba(184,165,141,0.25);border-color:rgba(184,165,141,0.7);color:#6E5A40}
.dsc-ban button{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(18,40,42,0.084);color:inherit;margin-right:-6px}
.dsc-stage{position:relative;flex:1;margin:8px 16px 0;min-height:0}
.dsc-card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#12282A;color:#F7F5EF;border:1px solid rgba(18,40,42,.12);box-shadow:0 18px 40px rgba(18,40,42,.16);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab}
.dsc-card.top:active{cursor:grabbing}
.dsc-card.back{transform:scale(.93) translateY(16px);opacity:.75;filter:saturate(.8);pointer-events:none;transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .3s}
.dsc-card .photo{position:absolute;inset:0;border-radius:0}
.dsc-card .photo .art{transition:transform .5s}
.dsc-bars{position:absolute;z-index:4;top:10px;left:14px;right:14px;display:flex;gap:5px;pointer-events:none}
.dsc-bars i{flex:1;height:3px;border-radius:3px;background:rgba(247,245,239,.38);overflow:hidden}
.dsc-bars i.on{background:#F7F5EF}
.dsc-shade{position:absolute;left:0;right:0;bottom:0;height:66%;background:linear-gradient(180deg,transparent,rgba(18,40,42,.55) 38%,rgba(18,40,42,.92));pointer-events:none;z-index:2}
.dsc-top-shade{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(180deg,rgba(18,40,42,.35),transparent);pointer-events:none;z-index:2}
.dsc-info{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 18px 18px;cursor:pointer}
.dsc-name{display:flex;align-items:baseline;gap:8px;font:600 29px/1.1 var(--f-d);letter-spacing:-.03em;color:#F7F5EF;text-shadow:0 1px 14px rgba(18,40,42,.45)}
.dsc-name small{font:500 25px var(--f-d);opacity:.85}
.dsc-name .on{width:10px;height:10px;border-radius:50%;background:#A8B8A0;box-shadow:0 0 0 3px rgba(168,184,160,.3);align-self:center}
.dsc-badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dsc-meta{display:flex;flex-direction:column;gap:3px;color:rgba(247,245,239,.92);font-size:13.5px;font-weight:500}
.dsc-meta span{display:flex;align-items:center;gap:6px}
.dsc-meta svg{color:#A8B8A0;flex:none}
.dsc-card .badge,.dsc-hero .badge{background:rgba(247,245,239,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dsc-card .badge.verified,.dsc-hero .badge.verified{color:#34564D;border-color:rgba(247,245,239,.9)}
.dsc-card .badge.friend,.dsc-hero .badge.friend{background:#A8B8A0;color:#12282A;border-color:#A8B8A0}
.dsc-card .badge.date,.dsc-card .badge.parent,.dsc-hero .badge.date,.dsc-hero .badge.parent{background:#E8E1D5;color:#6E5A40;border-color:#E8E1D5}
.dsc-why{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dsc-why b{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;color:#F7F5EF;background:rgba(247,245,239,.16);border:1px solid rgba(247,245,239,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dsc-why b.g{background:rgba(168,184,160,.28);border-color:rgba(168,184,160,.6)}
.dsc-chev{position:absolute;right:16px;top:-2px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(247,245,239,.18);border:1px solid rgba(247,245,239,.35);color:#F7F5EF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:6}
.dsc-stamp{position:absolute;z-index:6;top:46px;padding:4px 14px;border:3px solid;border-radius:12px;font:700 28px var(--f-d);letter-spacing:.08em;opacity:0;pointer-events:none;background:rgba(247,245,239,.9)}
.dsc-stamp.like{left:20px;color:#34564D;border-color:#34564D;transform:rotate(-12deg)}
.dsc-stamp.nope{right:20px;color:#B4533F;border-color:#B4533F;transform:rotate(12deg)}
.dsc-stamp.sup{left:50%;margin-left:-60px;top:70px;color:#12282A;border-color:#A8B8A0;background:#A8B8A0}
.dsc-actions{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px}
.dsc-act{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#F7F5EF;border:1px solid rgba(18,40,42,.1);transition:transform .15s cubic-bezier(.2,1.5,.4,1),box-shadow .2s;box-shadow:0 8px 20px rgba(18,40,42,.12)}
.dsc-act:active{transform:scale(.9)}
.dsc-act.pass{color:#12282A}
.dsc-act.sup{background:#A8B8A0;border-color:#A8B8A0;color:#12282A}
.dsc-act.like{width:74px;height:74px;background:#34564D;border:0;color:#F7F5EF;box-shadow:0 10px 26px rgba(52,86,77,.32)}
.dsc-act.boost{background:#B8A58D;border-color:#B8A58D;color:#12282A}
.dsc-act.boost.active{box-shadow:0 0 0 4px rgba(184,165,141,.35),0 8px 20px rgba(18,40,42,.12);animation:dscPulse 2.4s ease-in-out infinite}
.dsc-act .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#12282A;color:#F7F5EF;border:2px solid #F7F5EF;font-size:11px;font-weight:700;line-height:16px;text-align:center}
.dsc-act .mm{position:absolute;bottom:-18px;font-size:10px;font-weight:700;color:#6E5A40;white-space:nowrap}
@keyframes dscPulse{50%{box-shadow:0 0 0 8px rgba(184,165,141,.18),0 8px 20px rgba(18,40,42,.12)}}
.dsc-shake{animation:dscShake .4s}
@keyframes dscShake{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.dsc-state{position:absolute;inset:0;border-radius:30px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:rgba(247,245,239,.6);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
.dsc-state::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;top:-80px;left:50%;margin-left:-130px;background:radial-gradient(circle,rgba(168,184,160,0.4),transparent 65%);pointer-events:none}
.dsc-state h3{font:600 22px/1.2 var(--f-d);letter-spacing:-.02em;margin:0;position:relative;text-wrap:balance}
.dsc-state p{margin:0;color:var(--mute);font-size:14px;position:relative;max-width:290px}
.dsc-state .btn{position:relative}
.dsc-orb{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#F7F5EF;border:1px solid rgba(52,86,77,.25);box-shadow:0 8px 24px rgba(18,40,42,.10);color:#34564D}
.dsc-orb.cool{background:#A8B8A0;border-color:#A8B8A0;color:#12282A}
.dsc-orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid currentColor;opacity:.3;animation:dscRing 3.2s ease-out infinite}
@keyframes dscRing{from{transform:scale(.85);opacity:.5}to{transform:scale(1.3);opacity:0}}
.dsc-clock{font:600 36px var(--f-d);letter-spacing:-.01em;color:#34564D;position:relative;font-variant-numeric:tabular-nums}
.dsc-state .row{position:relative;flex-wrap:wrap;justify-content:center}
/* match overlay: two shapes meeting, like the mark */
.dsc-match{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px 40px;text-align:center;color:#F7F5EF;background:radial-gradient(70% 40% at 50% 30%,rgba(52,86,77,.85),transparent 75%),rgba(18,40,42,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:fade .3s;overflow:hidden}
.dsc-match.friend{background:radial-gradient(70% 40% at 50% 30%,rgba(168,184,160,.35),transparent 75%),rgba(18,40,42,.94)}
.dsc-av{position:relative;height:170px;width:100%;display:flex;justify-content:center;align-items:center}
.dsc-av .a{position:absolute;border-radius:50%;box-shadow:0 0 0 3px #12282A,0 0 0 5px #A8B8A0}
.dsc-av .a.l{animation:dscL .9s cubic-bezier(.2,1.1,.3,1) both;margin-right:88px}
.dsc-av .a.r{animation:dscR .9s cubic-bezier(.2,1.1,.3,1) both;margin-left:88px;box-shadow:0 0 0 3px #12282A,0 0 0 5px #B8A58D}
.dsc-lens{position:absolute;left:50%;top:50%;margin:-35px 0 0 -12px;width:24px;height:70px;z-index:3;display:grid;place-items:center;animation:dscLens .6s .75s cubic-bezier(.2,1.3,.4,1) both}
.dsc-lens svg.l{position:absolute;inset:0}
.dsc-lens .h{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#A8B8A0;color:#12282A;box-shadow:0 0 0 3px #12282A}
@keyframes dscLens{from{opacity:0;transform:scale(.3)}}
@keyframes dscL{from{transform:translateX(-260px) scale(.8);opacity:0}}
@keyframes dscR{from{transform:translateX(260px) scale(.8);opacity:0}}
.dsc-burst{position:absolute;left:50%;top:50%;width:10px;height:10px}
.dsc-burst i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:var(--c);animation:dscBurst 1.1s .6s cubic-bezier(.1,.8,.3,1) both}
@keyframes dscBurst{from{transform:translate(0,0) scale(.2);opacity:.9}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.dsc-flash{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:2px solid rgba(168,184,160,.7);animation:dscFlash 1s .6s ease-out both}
@keyframes dscFlash{from{transform:scale(.5);opacity:1}to{transform:scale(6);opacity:0}}
.dsc-match h2{font:600 36px/1.05 var(--f-d);margin:8px 0 6px;letter-spacing:-.03em;color:#F7F5EF;animation:dscRise .6s .6s both}
.dsc-match p{margin:0 0 16px;color:rgba(247,245,239,.78);animation:dscRise .6s .7s both}
@keyframes dscRise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dsc-moves{display:flex;flex-direction:column;gap:8px;width:100%;margin-bottom:18px;animation:dscRise .6s .8s both}
.dsc-moves small{color:rgba(247,245,239,.6);font-weight:600;font-size:12px}
.dsc-move{min-height:44px;padding:8px 14px;border-radius:16px;background:rgba(247,245,239,.1);border:1px solid rgba(247,245,239,.22);color:#F7F5EF;font-weight:500;font-size:13.5px;text-align:left;line-height:1.3}
.dsc-move:active{background:rgba(168,184,160,.3)}
.dsc-match .btns{display:flex;flex-direction:column;gap:10px;width:100%;animation:dscRise .6s .9s both}
.dsc-match .btn.primary{background:#A8B8A0;color:#12282A;box-shadow:none}
.dsc-match .btn.ghost{color:#F7F5EF;background:transparent;border-color:rgba(247,245,239,.3)}
/* filters sheet */
.dsc-f h3{margin-bottom:2px}
.dsc-frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 0}
.dsc-frow+.dsc-frow{border-top:1px solid rgba(18,40,42,0.049)}
.dsc-frow .t{font-weight:700}
.dsc-frow .s{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
.dsc-lockbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:rgba(184,165,141,0.25);border:1px solid rgba(184,165,141,0.7);color:#6E5A40;font-weight:700;font-size:12px}
.dsc-ages{display:flex;gap:10px;align-items:center}
.dsc-ages .input{text-align:center;font-weight:800}
.dsc-range{width:100%;accent-color:#34564D;height:44px}
.dsc-fsec{font:800 12px var(--f-b);color:var(--mute);margin:16px 2px 6px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dsc-fsec svg{color:#6E5A40}
.dsc-glob{padding:14px;border-radius:18px;background:rgba(168,184,160,0.22);border:1px solid rgba(168,184,160,0.8)}
/* ---------- profile ---------- */
.dsc-pf{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}
.dsc-pf::-webkit-scrollbar{display:none}
.dsc-hero{position:relative;height:500px;margin:0 12px;border-radius:30px;overflow:hidden;border:1px solid rgba(18,40,42,.1);box-shadow:0 14px 36px rgba(18,40,42,.14);flex:none;background:#12282A;color:#F7F5EF}
.dsc-hero .photo{position:absolute;inset:0;border-radius:0}
.dsc-hero-top{position:absolute;z-index:8;top:6px;left:18px;right:18px;display:flex;justify-content:space-between}
.dsc-hero .dsc-bars{top:68px;z-index:4}
.dsc-hero .dsc-info{cursor:default;padding-bottom:20px}
.dsc-body{padding:16px 18px 0}
.dsc-pcard{position:relative;margin-top:12px;padding:18px 18px 16px;border-radius:24px;background:rgba(247,245,239,.85);box-shadow:0 1px 2px rgba(18,40,42,.04);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.dsc-pcard .q{font-size:12.5px;font-weight:700;color:#34564D;letter-spacing:.02em;margin-bottom:6px;padding-right:48px}
.dsc-pcard .a{font:600 21px/1.25 var(--f-d);letter-spacing:-.02em;padding-right:48px;text-wrap:balance}
.dsc-pcard .h{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#F7F5EF;border:1px solid var(--stroke2);color:#34564D;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.dsc-pcard .h:active{transform:scale(.85)}
.dsc-pcard .h.on{background:#34564D;color:#F7F5EF;border:0;box-shadow:0 4px 12px rgba(52,86,77,.3)}
.dsc-lab{font:700 12px var(--f-b);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.dsc-bio{font-size:16px;line-height:1.55;margin:0}
.dsc-bar{position:absolute;z-index:30;left:0;right:0;bottom:0;padding:34px 18px 18px;display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,rgba(232,225,213,0),#E8E1D5 60%)}
.dsc-bar .btn{min-height:56px}
.dsc-bar .pass{width:56px;padding:0;flex:none;background:#F7F5EF;color:#12282A}
.dsc-f [data-apply]{position:sticky;bottom:-18px;z-index:3}
.dsc-f [data-apply]{box-shadow:0 8px 22px rgba(52,86,77,.28),0 0 0 14px rgba(247,245,239,0.96)}

/* me.css */
/* me / edit-profile / settings */
.me-head{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px 18px;overflow:hidden}
.me-aura{position:absolute;inset:-40% -20% auto;height:200px;background:radial-gradient(closest-side,rgba(168,184,160,.45),transparent);pointer-events:none}
.me-head>:not(.me-aura){position:relative}
.me-name{font:600 22px/1.2 var(--f-d);margin:14px 0 4px;letter-spacing:-.025em}
.me-name span{color:var(--mute);font-weight:500}
.me-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 16px}
.me-btns{width:100%}
.me-btns .btn{padding:0 10px}
.me-good{color:#34564D;font:700 16px var(--f-d)}
.me-str b.grad-text{font:700 16px var(--f-d);color:#6E5A40;-webkit-text-fill-color:#6E5A40}
.me-use{padding:10px 0}
.me-use:first-child{padding-top:0}
.me-use .meter{margin-top:8px}
.me-use .meter.cool i{background:#A8B8A0}
.me-use-l{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mute)}
.me-use-l svg{color:#34564D}
.me-use-v{font:700 16px var(--f-d)}
.me-use-v small{font:600 12px var(--f-b);color:var(--mute)}
.me-cd{font-variant-numeric:tabular-nums}
.me-foot{margin-top:8px;padding-top:12px;border-top:1px solid rgba(18,40,42,0.049)}
.me-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(168,184,160,0.16);color:#34564D;flex:none}
.me-state{margin-right:2px}
.me-rule{display:flex;gap:10px;align-items:flex-start}
.me-rule>svg{color:#34564D;flex:none;margin-top:3px}
.me-rule b{display:block}
.ed-photo-wrap{display:flex;gap:14px;margin-bottom:18px;align-items:center}
.ed-photo{width:112px;height:150px;flex:none;border:1px solid var(--stroke2);box-shadow:0 8px 24px rgba(18,40,42,.12)}
.ed-photo-side{flex:1}
.ed-sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ed-swatch{position:relative;overflow:hidden;width:100%;aspect-ratio:1;min-height:44px;border-radius:14px;border:2px solid rgba(18,40,42,.08);transition:transform .15s}
.ed-swatch i{position:absolute;display:block;border-radius:50%}
.ed-swatch i.h{width:34%;height:34%;left:33%;top:26%}
.ed-swatch i.b{width:78%;height:56%;left:11%;top:66%}
.ed-swatch.on{border-color:#12282A;box-shadow:0 0 0 2px #F7F5EF,0 0 0 4px #34564D;transform:scale(1.04)}
.ed-err{display:none;color:#B4533F;margin:4px 0 0 4px;font-weight:700}
.ed-err.show{display:block}
.ed-count{display:block;text-align:right;margin:4px 4px 0}
.ed-prompt{padding:12px}
.ed-cty{width:110px;flex:none}
.ed-cty button{padding:0;min-height:36px}
.st-pt{display:flex;gap:10px;font-size:13.5px;color:var(--mute);margin-bottom:10px;align-items:flex-start}
.st-pt svg{flex:none;color:#34564D;margin-top:2px}
.st-danger,.st-danger .t,.st-danger svg{color:#B4533F!important}
#stBody .item>svg{color:var(--mute)}

/* messages.css */
/* Messages + Chat */
.msg-search{display:block;position:relative;margin:0 0 12px;padding:0 18px}
.msg-search .input{padding-left:44px;min-height:46px;border-radius:999px}
.msg-search svg{position:absolute;left:34px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.msg-seg{margin:0 18px 12px}
.msg-new{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none;padding-left:20px;padding-right:20px}
.msg-new::-webkit-scrollbar{display:none}
.msg-nm{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-height:44px}
.msg-nm:active{transform:scale(.95)}
.msg-nm b{font-size:12.5px;font-weight:700;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-nm .msg-tag{position:absolute;top:50px;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:#F7F5EF;border:1px solid var(--stroke2);letter-spacing:.02em}
.msg-nm .msg-tag.date{color:#6E5A40;border-color:rgba(184,165,141,0.8)}
.msg-nm .msg-tag.friend{color:#34564D;border-color:rgba(168,184,160,0.9)}
.msg-nm .avatar.ring.date{box-shadow:0 0 0 2px #F7F5EF,0 0 0 4px #B8A58D}
.msg-nm .avatar.ring.friend{box-shadow:0 0 0 2px #F7F5EF,0 0 0 4px #34564D}
.msg-nm b{margin-top:8px}
.msg-conv{display:flex;align-items:center;gap:13px;padding:11px 8px 11px 14px;min-height:72px;width:100%;text-align:left;position:relative;animation:msgin .3s both}
.msg-conv+.msg-conv{border-top:1px solid rgba(18,40,42,0.08)}
.msg-conv:active{background:var(--glass2)}
.msg-conv .msg-mid{flex:1;min-width:0}
.msg-conv .msg-top{display:flex;align-items:center;gap:7px}
.msg-conv .msg-name{font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-conv .badge{height:19px;font-size:10px;padding:0 7px}
.msg-conv .msg-prev{color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;margin-top:2px}
.msg-conv.unread .msg-prev{color:var(--ink);font-weight:700}
.msg-conv .msg-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;min-width:34px}
.msg-conv .msg-time{font-size:11.5px;color:var(--dim);font-weight:600}
.msg-conv.unread .msg-time{color:#34564D}
.msg-pill{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#34564D;color:#F7F5EF;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.msg-more{width:40px;height:44px;flex:none;display:grid;place-items:center;color:var(--dim);border-radius:12px}
.msg-more:active{background:var(--glass3)}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}
.msg-empty{padding:34px 24px;text-align:center}
.msg-empty .msg-art{position:relative;width:150px;height:110px;margin:0 auto 18px}
.msg-empty .msg-art i{position:absolute;display:grid;place-items:center;border-radius:22px;background:var(--glass2);border:1px solid var(--stroke2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.msg-empty .msg-art i:nth-child(1){left:0;top:10px;width:84px;height:56px;color:#34564D;box-shadow:0 8px 24px rgba(18,40,42,0.08);transform:rotate(-8deg);border-radius:22px 22px 22px 6px}
.msg-empty .msg-art i:nth-child(2){right:0;top:44px;width:84px;height:56px;color:#6E5A40;box-shadow:0 8px 24px rgba(18,40,42,0.08);transform:rotate(6deg);border-radius:22px 22px 6px 22px}
.msg-empty b{display:block;font:700 19px var(--f-d);margin-bottom:8px}
.msg-empty p{margin:0 0 20px;color:var(--mute)}

/* ---- chat ---- */
.msg-head{flex:none;display:flex;align-items:center;gap:8px;padding:4px 14px 10px 12px;border-bottom:1px solid rgba(18,40,42,0.08);background:rgba(247,245,239,.8);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.msg-who{flex:1;display:flex;align-items:center;gap:11px;min-height:48px;text-align:left;border-radius:14px}
.msg-who .msg-nm2{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px;line-height:1.2}
.msg-who .msg-nm2 .badge{height:19px;font-size:10px;padding:0 7px}
.msg-who .msg-act{font-size:12.5px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:5px}
.msg-who .msg-act.on{color:#34564D}
.msg-who .msg-act.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#5E8C5A}
.msg-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 14px 10px;scrollbar-width:none;display:flex;flex-direction:column}
.msg-scroll::-webkit-scrollbar{display:none}
.msg-scroll>.msg-list{margin-top:auto}
.msg-sep{text-align:center;font-size:11.5px;font-weight:700;color:var(--dim);margin:14px 0 6px;letter-spacing:.02em}
.msg-sys{display:flex;justify-content:center;margin:12px 0 6px}
.msg-sys>span{display:inline-flex;gap:7px;align-items:flex-start;max-width:88%;padding:8px 14px;border-radius:16px;background:#E8E1D5;border:1px solid rgba(18,40,42,0.08);color:#5B6B66;font-size:12.5px;line-height:1.4;text-align:left}
.msg-sys svg{flex:none;margin-top:1px;color:#34564D}
.msg-row{display:flex;flex-direction:column;margin-top:2px;animation:bubin .32s cubic-bezier(.2,.9,.3,1.25) both}
.msg-row.first{margin-top:10px}
.msg-row.me{align-items:flex-end;transform-origin:100% 100%}
.msg-row.them{align-items:flex-start;transform-origin:0 100%}
@keyframes bubin{from{opacity:0;transform:translateY(10px) scale(.88)}}
.msg-bub{max-width:80%;padding:9px 14px;border-radius:20px;font-size:15.5px;line-height:1.38;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg-row.me .msg-bub{background:#34564D;color:#F7F5EF;box-shadow:none;border-bottom-right-radius:6px}
.msg-row.them .msg-bub{background:#fff;color:#12282A;border:1px solid rgba(18,40,42,0.1);border-bottom-left-radius:6px}
.msg-row.me:not(.first) .msg-bub{border-top-right-radius:8px}
.msg-row.them:not(.first) .msg-bub{border-top-left-radius:8px}
.msg-row.me:not(.last) .msg-bub{border-bottom-right-radius:20px}
.msg-row.them:not(.last) .msg-bub{border-bottom-left-radius:20px}
.msg-flag{max-width:82%;margin-top:4px;font-size:11.5px;font-weight:700;color:#6E5A40;display:flex;gap:5px;align-items:flex-start;justify-content:flex-end;text-align:right}.msg-flag svg{flex:none;margin-top:1px}
.msg-voice{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;min-width:200px}
.msg-play{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(247,245,239,0.2);color:#F7F5EF}
.msg-row.them .msg-play{background:#34564D;color:#F7F5EF}
.msg-wave{display:flex;align-items:center;gap:2.5px;height:28px;flex:1}
.msg-wave i{width:3px;border-radius:2px;background:currentColor;opacity:.4;transition:opacity .15s}
.msg-wave i.on{opacity:1}
.msg-vt{font-size:12px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.msg-meet{width:min(300px,86%);padding:16px;border-radius:24px;background:rgba(255,255,255,.75);border:1px solid rgba(52,86,77,0.35);box-shadow:0 8px 24px rgba(18,40,42,0.08)}
.msg-meet.play{background:rgba(184,165,141,0.2);border-color:rgba(184,165,141,0.8)}
.msg-meet .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.msg-meet .mi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#34564D;color:#F7F5EF;flex:none}
.msg-meet.play .mi{background:#B8A58D;color:#12282A}
.msg-meet .mt{font:700 14px var(--f-d);line-height:1.2}
.msg-meet .ms{font-size:11.5px;color:var(--mute);font-weight:600}
.msg-meet .ml{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:600;margin:6px 0}
.msg-meet .ml svg{flex:none;margin-top:2px;color:#34564D}
.msg-meet.play .ml svg{color:#6E5A40}
.msg-meet .mn{font-size:13px;color:var(--mute);margin:8px 0 0;font-style:italic}
.msg-meet .mb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.msg-meet .btn{min-height:44px;font-size:13.5px;white-space:normal;text-align:center;line-height:1.2}
.msg-meet.play .btn.primary{background:#6E5A40;color:#F7F5EF;box-shadow:none}
.msg-typing .msg-bub{display:flex;gap:5px;padding:14px 16px;align-items:center}
.msg-typing i{width:7px;height:7px;border-radius:50%;background:#A8B8A0;animation:msgdot 1.1s infinite ease-in-out}
.msg-typing i:nth-child(2){animation-delay:.15s}
.msg-typing i:nth-child(3){animation-delay:.3s}
@keyframes msgdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.msg-typing{display:none;margin-top:10px}.msg-typing.show{display:flex}
.msg-moves{flex:none;display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.msg-moves::-webkit-scrollbar{display:none}
.msg-moves .lbl{flex:none;align-self:center;font-size:11px;font-weight:800;color:#6E5A40;letter-spacing:.04em;text-transform:uppercase}
.msg-moves button{flex:none;min-height:44px;max-width:250px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.8);color:#12282A;border:1px solid rgba(52,86,77,0.35);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-moves button:active{background:rgba(52,86,77,0.15)}
.msg-comp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px 16px;background:rgba(247,245,239,.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid rgba(18,40,42,0.08)}
.msg-comp .icon-btn{width:44px;height:44px}
.msg-in{position:relative;flex:1}
.msg-in input{width:100%;height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(18,40,42,0.12);color:#12282A;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.msg-in input:focus{border-color:#34564D;box-shadow:0 0 0 3px rgba(52,86,77,0.15)}
.msg-in input::placeholder{color:var(--dim)}
.msg-rec{position:absolute;inset:0;display:none;align-items:center;gap:10px;padding:0 16px;border-radius:999px;background:#F4E3DD;border:1px solid rgba(180,83,63,0.6);font-weight:700;font-size:14px;color:#8E3A28}
.msg-rec b{width:10px;height:10px;border-radius:50%;background:#B4533F;animation:msgblink 1s infinite}
.msg-rec span{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}
@keyframes msgblink{50%{opacity:.25}}
.msg-comp.rec .msg-rec{display:flex}
.msg-comp.rec .msg-in input{visibility:hidden}
.msg-go{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:#F7F5EF;background:#34564D;box-shadow:none;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.msg-go:active{transform:scale(.92)}
.msg-go[hidden]{display:none}
.msg-comp.rec .msg-mic{background:#B4533F;color:#F7F5EF;box-shadow:0 0 0 6px rgba(180,83,63,0.18);transform:scale(1.12)}
.msg-comp.off{justify-content:center;padding:14px 20px 22px;text-align:center;color:var(--mute);font-size:13.5px;font-weight:600;gap:10px;align-items:center}
.msg-warn{padding:14px;border-radius:18px;background:rgba(184,165,141,0.22);border:1px solid rgba(184,165,141,0.75);margin:10px 0 14px;font-size:14px}
.msg-warn.bad{background:rgba(180,83,63,0.1);border-color:rgba(180,83,63,0.6)}
.msg-warn b{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:#6E5A40}
.msg-warn.bad b{color:#8E3A28}
.msg-tip{display:flex;gap:10px;font-size:13px;color:var(--mute);margin:8px 2px}
.msg-tip svg{flex:none;color:#34564D;margin-top:2px}
.msg-tip b{color:var(--ink)}

/* onboarding.css */
/* onboarding (.onb-) + shared kids editor */
.onb-welcome{position:relative;flex:1;display:flex;flex-direction:column;padding:6px 24px 26px;overflow:hidden}
.onb-orb{position:absolute;left:50%;top:22%;width:380px;height:380px;margin-left:-190px;border-radius:50%;background:radial-gradient(circle,rgba(168,184,160,.5),rgba(184,165,141,.16) 50%,transparent 70%);filter:blur(24px);animation:onbBreath 8s ease-in-out infinite;pointer-events:none}
@keyframes onbBreath{50%{transform:scale(1.14);opacity:.8}}
.onb-brand{position:relative;text-align:center;padding-top:14px}
.onb-word{display:flex;justify-content:center;animation:onbWord .8s cubic-bezier(.2,.9,.3,1) both}
.onb-word .logo{gap:12px}
.onb-word .logo b{font-size:54px;letter-spacing:-.05em;margin-top:-6px}
@keyframes onbWord{from{opacity:0;transform:translateY(10px)}}
.onb-tag{margin:14px 0 0;font-size:17px;line-height:1.45;color:var(--mute)}
.onb-tag b{color:var(--moss);font-weight:700}
.onb-hero{position:relative;flex:1;min-height:250px;margin:6px -6px}
.onb-fc{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 14px;width:76%;border-radius:22px;background:rgba(247,245,239,.78);border:1px solid rgba(18,40,42,.08);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 8px 24px rgba(18,40,42,.10);animation:onbFloat 8s ease-in-out infinite,onbIn .8s cubic-bezier(.2,.9,.3,1) both}
.onb-fc>div{flex:1}
.onb-fc b{display:block;font:700 15px var(--f-d)}
.onb-fc span:not(.onb-fi):not(.badge):not(.avatar){display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.onb-fc.a{left:0;top:6%;transform:rotate(-5deg);--r:-5deg;animation-delay:0s,.2s}
.onb-fc.b{right:0;top:36%;transform:rotate(4deg);--r:4deg;animation-delay:-2s,.4s}
.onb-fc.c{left:6%;top:67%;transform:rotate(-2deg);--r:-2deg;animation-delay:-4s,.6s}
.onb-fc.c>div{min-width:0}
@keyframes onbFloat{50%{transform:translateY(-5px) rotate(var(--r))}}
@keyframes onbIn{from{opacity:0;transform:translateY(30px) scale(.9) rotate(var(--r))}}
.onb-fi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.onb-fi.cyan{background:rgba(168,184,160,.45);color:#34564D}
.onb-fi.pink{background:#34564D;color:#F7F5EF}
.onb-fi.violet{background:rgba(184,165,141,.3);color:#6E5A40}
.onb-cta{position:relative;text-align:center}
.onb-big{min-height:56px;font-size:16px}
.onb-link{display:inline-flex;align-items:center;min-height:44px;margin:6px 0 0;padding:0 14px;color:var(--moss);font-weight:700;font-size:14px}
.onb-cta p{margin:2px 0 0}

/* header / footer */
.onb-head{flex:none;display:flex;align-items:center;gap:14px;padding:4px 18px 8px}
.onb-meter{height:6px}
.onb-stepn{min-width:30px;text-align:right;font-weight:700}
.onb-body{padding-bottom:24px}
.onb-foot{flex:none;padding:12px 18px 22px;background:linear-gradient(180deg,rgba(239,234,224,0),rgba(239,234,224,.95) 35%)}
.onb-h{font:600 27px/1.12 var(--f-d);letter-spacing:-.03em;margin:6px 0 8px;text-wrap:balance}
.onb-sub{margin:0 0 20px;font-size:15px}
.onb-step.fwd{animation:onbFwd .38s cubic-bezier(.2,.9,.3,1)}
.onb-step.bwd{animation:onbBwd .38s cubic-bezier(.2,.9,.3,1)}
@keyframes onbFwd{from{opacity:0;transform:translateX(34px)}}
@keyframes onbBwd{from{opacity:0;transform:translateX(-34px)}}
.onb-fine{text-align:center;margin:18px 0 0}
.onb-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* sign-in */
.onb-country{margin-bottom:4px}
.onb-flag{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:6px;background:rgba(18,40,42,0.08);font-size:10.5px;letter-spacing:.04em;margin-right:4px}
.onb-methods{display:flex;flex-direction:column;gap:10px}
.onb-method{display:flex;align-items:center;gap:14px;min-height:62px;padding:0 16px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:left;transition:transform .15s,border-color .2s,box-shadow .2s;color:var(--mute)}
.onb-method:hover{border-color:var(--stroke2)}
.onb-method:active,.onb-method.busy{transform:scale(.98);border-color:var(--moss);box-shadow:0 0 0 3px rgba(52,86,77,.12)}
.onb-method .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--glass2);color:var(--ink)}
.onb-method .t{flex:1;font-weight:700;font-size:16px;color:var(--ink)}

/* basics */
.onb-warn{display:flex;gap:12px;padding:14px;border-radius:18px;background:rgba(180,83,63,0.1);border:1px solid rgba(180,83,63,0.5);color:#8E3A28;font-size:13.5px;margin:-4px 0 14px;animation:onbShake .4s}
.onb-warn[hidden]{display:none}
.onb-warn svg{flex:none;color:var(--red)}
.onb-warn b{color:#8E3A28}
@keyframes onbShake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* verify */
.onb-idtypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.onb-idtype{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);font-weight:700;font-size:13.5px;color:var(--mute);transition:all .2s}
.onb-idtype.on{color:var(--pine);border-color:var(--moss);background:rgba(52,86,77,0.08);box-shadow:0 0 0 1px var(--moss)}
.onb-idtype.on svg{color:var(--moss)}
.onb-drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px;border-radius:22px;border:1.5px dashed rgba(18,40,42,0.22);background:rgba(247,245,239,.5);cursor:pointer;text-align:center;transition:all .2s}
.onb-drop:hover,.onb-drop:focus-within{border-color:var(--moss);background:rgba(168,184,160,0.18)}
.onb-drop .ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(168,184,160,.4);color:var(--moss);margin-bottom:6px}
.onb-file{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(168,184,160,0.22);border:1px solid rgba(52,86,77,0.35)}
.onb-file>svg{flex:none;width:30px;height:30px;padding:6px;border-radius:50%;background:var(--moss);color:#F7F5EF}
.onb-file b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onb-file span{display:block}
.onb-facts{margin-top:22px;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke)}
.onb-facts>div{display:flex;gap:12px;font-size:13.5px;color:var(--mute);line-height:1.4}
.onb-facts svg{flex:none;color:var(--moss);margin-top:1px}
.onb-facts b{color:var(--ink)}
.onb-scanwrap{text-align:center;padding-top:8px}
.onb-scan{position:relative;width:240px;height:240px;margin:6px auto 22px}
.onb-spin{transform-origin:120px 120px;animation:onbSpin 14s linear infinite}
@keyframes onbSpin{to{transform:rotate(360deg)}}
.onb-prog{animation:onbProg 3s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes onbProg{to{stroke-dashoffset:0}}
.onb-line{animation:onbLine 1.1s ease-in-out infinite alternate}
@keyframes onbLine{from{transform:translateY(30px)}to{transform:translateY(210px)}}
.onb-scantxt{font:600 19px var(--f-d);letter-spacing:-.02em;margin:0 0 6px}
.onb-verified{text-align:center;padding:10px 0 4px;display:flex;flex-direction:column;align-items:center;gap:12px}
.onb-seal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#F7F5EF;background:#34564D;box-shadow:0 0 0 8px rgba(168,184,160,.45),0 12px 30px rgba(18,40,42,.15);animation:onbSeal .7s cubic-bezier(.2,.9,.3,1.4)}
@keyframes onbSeal{from{transform:scale(.4);opacity:0}}
.onb-verified p{margin:0}

/* purpose / profile */
.onb-date{margin-top:18px;border-color:rgba(52,86,77,0.25)}
.onb-dicon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:#34564D;color:#F7F5EF}
.onb-prev .photo{height:200px;border-radius:26px;border:1px solid rgba(18,40,42,.1);align-items:end;justify-items:start;box-shadow:0 8px 24px rgba(18,40,42,.10)}
.onb-prevtxt{position:absolute;left:16px;bottom:14px;right:16px;text-align:left;color:#F7F5EF;padding-top:30px}
.onb-prevtxt b{display:block;font:600 19px var(--f-d);letter-spacing:-.02em;color:#F7F5EF;text-shadow:0 1px 10px rgba(18,40,42,.5)}
.onb-prevtxt span{font-size:13px;color:rgba(247,245,239,.9);text-shadow:0 1px 8px rgba(18,40,42,.5)}
.onb-sw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.onb-sw button{width:34px;height:34px;border-radius:50%;border:2px solid #F7F5EF;box-shadow:0 0 0 1px rgba(18,40,42,0.14);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;position:relative}
.onb-sw button::before{content:"";position:absolute;inset:-6px}
.onb-sw button.on{transform:scale(1.12);box-shadow:0 0 0 2px #34564D}
.onb-slot{padding:12px}
.onb-slot .row{margin-bottom:10px}
.onb-slot .select{min-height:46px;font-size:14.5px;font-weight:700}

/* parents */
.onb-choices{display:flex;flex-direction:column;gap:10px}
.onb-choice{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 18px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);font-weight:700;text-align:left;color:var(--mute);transition:all .2s}
.onb-choice span{flex:1;font-size:15.5px}
.onb-choice i{width:22px;height:22px;border-radius:50%;border:2px solid var(--stroke2);transition:all .2s}
.onb-choice.on{color:var(--pine);border-color:var(--moss);background:rgba(52,86,77,0.08);box-shadow:0 0 0 1px var(--moss)}
.onb-choice.on i{background:var(--moss);border-color:var(--moss);box-shadow:inset 0 0 0 4px #F7F5EF}
.onb-choice.lime.on{border-color:#B8A58D;background:rgba(184,165,141,0.2);box-shadow:0 0 0 1px #B8A58D}
.onb-choice.lime.on svg{color:#6E5A40}
.onb-choice.lime.on i{background:#8C7656;border-color:#8C7656;box-shadow:inset 0 0 0 4px #F7F5EF}
.onb-kids{margin-top:18px;padding:18px;border-radius:24px;background:rgba(184,165,141,0.14);border:1px solid rgba(184,165,141,0.5)}
.onb-kids.in{animation:onbFwd .4s cubic-bezier(.2,.9,.3,1)}
.onb-kids .sec{color:var(--mute)}
.onb-stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.onb-stepper b{display:block}
.onb-count{display:flex;align-items:center;gap:10px}
.onb-count output{min-width:30px;text-align:center;font:600 24px var(--f-d);color:#6E5A40}
.onb-count output.bump{animation:onbBump .3s cubic-bezier(.3,1.7,.5,1)}
@keyframes onbBump{from{transform:scale(1.5)}}
.onb-kids .chip.on{background:#B8A58D;border-color:#B8A58D;color:#12282A;box-shadow:none}
.onb-kids .seg button.on{background:#8C7656;color:#F7F5EF;box-shadow:none}
.onb-note{display:flex;gap:12px;margin-top:18px;padding:14px;border-radius:18px;background:rgba(184,165,141,0.2);border:1px solid rgba(184,165,141,0.6);color:#4a3d2a;font-size:13.5px;line-height:1.4}
.onb-note svg{flex:none;color:#6E5A40}
.onb-note b{color:#6E5A40}

/* safety */
.onb-rules{display:flex;flex-direction:column;gap:12px}
.onb-rule{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--stroke);animation:onbFwd .5s cubic-bezier(.2,.9,.3,1) both}
.onb-rule .ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none}
.onb-rule b{display:block;font-size:15.5px;margin-bottom:2px}
.onb-rule div span{display:block;color:var(--mute);font-size:13.5px;line-height:1.4}
.onb-rule.pink .ico{background:#34564D;color:#F7F5EF}
.onb-rule.violet .ico{background:rgba(184,165,141,.3);color:#6E5A40}
.onb-rule.red .ico{background:rgba(180,83,63,0.12);color:var(--red)}
.onb-rule.cyan .ico{background:rgba(168,184,160,.45);color:#34564D}
.field>span.onb-lbl{display:flex;justify-content:space-between}
.onb-swl{width:100%;font-weight:700}
.onb-sw{gap:10px}
.onb-kids .seg button{padding:0 6px;white-space:nowrap;font-size:13px}

/* parents.css */
/* parents (.par-) */
.par-card{padding:12px 14px;border-radius:18px;background:rgba(184,165,141,0.2);border:1px solid rgba(184,165,141,0.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.par-card-h{display:flex;align-items:center;gap:8px;color:#6E5A40;font-size:13px}
.par-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(184,165,141,0.45)}
.par-n{margin-left:auto;font-weight:700;font-size:12.5px;color:#6E5A40}
.par-ages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.par-age{height:24px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:#6E5A40;background:rgba(247,245,239,.7);border:1px solid rgba(184,165,141,0.6)}
.par-about{margin:10px 0 0;font-size:14px;line-height:1.4;color:#12282A}

.par-s{margin-top:18px}
.par-custom{margin-top:10px}
.par-custom[hidden]{display:none}
.par-tip{display:flex;gap:12px;margin-top:18px;padding:13px 14px;border-radius:18px;background:rgba(168,184,160,0.22);border:1px solid rgba(168,184,160,0.8);font-size:13px;color:#12282A;line-height:1.4}
.par-tip svg{flex:none;color:var(--moss)}
.par-tip b{color:var(--moss)}
.sheet #mpPlaces .chip{min-height:40px}

.par-scroll{padding-top:0}
.par-toggle{border-color:var(--stroke2);transition:all .3s}
.par-toggle.on{border-color:rgba(184,165,141,0.8);box-shadow:0 0 0 1px rgba(184,165,141,0.5)}
.par-big{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(184,165,141,0.35);color:#6E5A40}
.par-toggle .switch input:checked+i{background:#8C7656;box-shadow:none}
.par-hero{padding:22px 4px 4px}
.par-hero .h-display{font-size:28px}
.par-hero p{margin:10px 0 16px}
.par-benefits{display:flex;flex-direction:column;gap:10px}
.par-b{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke)}
.par-b b{display:block;font-size:15.5px}
.par-b div span{display:block;color:var(--mute);font-size:13.5px;line-height:1.4;margin-top:1px}
.par-b .ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none}
.par-b.lime .ico{background:rgba(184,165,141,0.35);color:#6E5A40}
.par-b.cyan .ico{background:rgba(168,184,160,.45);color:#34564D}
.par-b.violet .ico{background:rgba(184,165,141,.2);color:#6E5A40}
.par-b.pink .ico{background:#34564D;color:#F7F5EF}
.par-quiet{display:flex;gap:12px;margin-top:16px;padding:14px;border-radius:18px;border:1px dashed var(--stroke2);color:var(--mute);font-size:13.5px;line-height:1.4}
.par-quiet svg{flex:none}
.par-quiet b{color:var(--ink)}
.par-cta{margin-top:20px;min-height:56px;font-size:16px}

.par-edit .onb-kids{margin-top:0}
.par-pvs{display:flex;flex-direction:column;gap:12px}
.par-pv-h{font-size:12.5px;font-weight:800;color:var(--mute);margin:0 4px 6px}
.par-pv-card{padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:12px}
.par-pv-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.par-hidden{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(18,40,42,0.03);border:1px dashed var(--stroke2);color:var(--mute);font-size:13px}
.par-li{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.par-li.lime{background:rgba(184,165,141,0.35);color:#6E5A40}
.par-li.pink{background:#34564D;color:#F7F5EF}
.par-li.violet{background:rgba(168,184,160,.45);color:#34564D}

/* meetup sheet: keep Cancel / Send proposal pinned to the visible bottom of the scrolling sheet */
.par-foot{position:sticky;bottom:-30px;z-index:3;margin:14px -20px -30px;padding:12px 20px 30px;background:linear-gradient(180deg,rgba(247,245,239,0),rgba(247,245,239,0.96) 28%)}
.par-hero .grad-text{-webkit-text-fill-color:#6E5A40;color:#6E5A40}

/* plans.css */
/* plans + paywall */
.pl-hero{position:relative;text-align:center;padding:10px 0 4px}
.pl-crown{width:54px;height:54px;border-radius:18px;display:inline-grid;place-items:center;margin-bottom:12px;background:#34564D;color:#F7F5EF;box-shadow:0 8px 22px rgba(18,40,42,.16)}
.pl-hero .h-display{font-size:28px}
.pl-tiers{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.pl-tier{position:relative;padding:18px 16px 16px;border-radius:var(--r);background:rgba(255,255,255,.6);border:1px solid var(--stroke);box-shadow:0 1px 2px rgba(18,40,42,.04)}
.pl-tier.cur{border-color:#34564D;box-shadow:0 0 0 1px #34564D}
.pl-tier.pop{background:#12282A;color:#F7F5EF;border-color:#12282A;box-shadow:0 14px 34px rgba(18,40,42,.22)}
.pl-tier.pop .pl-pr small{color:rgba(247,245,239,.7)}
.pl-tier.pop .pl-f li{color:#F7F5EF}
.pl-tier.pop .pl-f svg{color:#A8B8A0}
.pl-tier.pop .badge.verified{background:rgba(168,184,160,.2);color:#A8B8A0;border-color:rgba(168,184,160,.5)}
.pl-tier.pop .btn.primary{background:#F7F5EF;color:#12282A;box-shadow:none}
.pl-tier.pop .btn:disabled{background:rgba(247,245,239,.12);color:rgba(247,245,239,.75);opacity:1}
.pl-flag{position:absolute;top:-11px;right:14px;display:inline-flex;gap:4px;align-items:center;height:22px;padding:0 10px;border-radius:999px;background:#A8B8A0;color:#12282A;font-size:11px;font-weight:700;box-shadow:0 4px 12px rgba(18,40,42,.15)}
.pl-tn{font:600 17px var(--f-d);display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.pl-pr{font:600 26px var(--f-d);margin-top:4px;letter-spacing:-.03em}
.pl-pr small{font:500 13px var(--f-b);color:var(--mute);letter-spacing:0}
.pl-f{list-style:none;margin:12px 0 14px;padding:0;display:grid;gap:6px}
.pl-f li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.pl-f svg{color:#34564D;flex:none}
.pl-tbl{border-radius:var(--r);background:rgba(255,255,255,.6);border:1px solid var(--stroke);padding:6px 4px;font-size:12.5px}
.pl-tr{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;align-items:center;min-height:38px;text-align:center;padding:0 6px;gap:2px}
.pl-tr+.pl-tr{border-top:1px solid rgba(18,40,42,.06)}
.pl-tr.head{min-height:34px;color:var(--mute);font-size:12px}
.pl-tr.head b.cur{color:#34564D}
.pl-tr.head b.pr,.pl-c.pr{color:#12282A}
.pl-rl{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;padding-right:4px;line-height:1.25}
.pl-c{display:flex;justify-content:center;font-weight:600;padding:2px 0;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-c.cur{background:rgba(168,184,160,.28);border-radius:8px}
.pl-c svg{color:#34564D}
.pl-lime{color:#34564D;display:inline-flex}

/* Global Pass */
.pl-glob{padding:16px}
.pl-glob.on{border-color:#34564D}
.pl-gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(168,184,160,.35);color:#34564D;flex:none}
.pl-cd{font:600 16px var(--f-d);color:#34564D;font-variant-numeric:tabular-nums}
.pl-cdw{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.pl-cdw small{font-size:11px;color:var(--mute);font-weight:600}
.pl-cdn{font:600 24px var(--f-d);letter-spacing:-.02em}
.pl-ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pl-rung{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 4px 10px;border-radius:16px;background:rgba(18,40,42,.04);border:1px solid rgba(18,40,42,.08)}
.pl-rung.cur{background:#34564D;border-color:#34564D;color:#F7F5EF;box-shadow:0 8px 20px rgba(52,86,77,.25)}
.pl-rn{font-size:11.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.pl-rung.cur .pl-rn{color:#A8B8A0}
.pl-rp2{font:600 16px var(--f-d);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-rs{font-size:10.5px;color:var(--mute);font-weight:500}
.pl-rung.cur .pl-rs{color:rgba(247,245,239,.75)}
.pl-save{margin-top:8px;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(168,184,160,.45);color:#12282A;white-space:nowrap}
.pl-save.none{background:rgba(18,40,42,.07);color:var(--mute)}
.pl-rung.cur .pl-save{background:#A8B8A0;color:#12282A}
.pl-ri{margin-top:8px;font-size:10.5px;font-weight:600;color:var(--mute);line-height:1.25}
.pl-rung.cur .pl-ri{color:rgba(247,245,239,.85)}
.pl-gnote{margin:12px 2px 0}
.pl-upsell{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(184,165,141,.2);border:1px solid rgba(184,165,141,.5);color:#12282A;font-size:13px;line-height:1.4}
.pl-upsell svg{flex:none;margin-top:2px;color:#6E5A40}
.pl-upsell b{font-weight:700;font-variant-numeric:tabular-nums}

.pl-lg{display:flex;gap:10px;flex-wrap:wrap}
.pl-lk.blur{filter:blur(7px);pointer-events:none;user-select:none}
.pl-pw{text-align:center}
.pl-pwi{width:60px;height:60px;border-radius:20px;display:inline-grid;place-items:center;margin:4px 0 12px;background:#34564D;color:#F7F5EF;box-shadow:0 8px 22px rgba(18,40,42,.16)}
.pl-reset{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(184,165,141,.2);border:1px solid rgba(184,165,141,.55);color:#6E5A40;font-size:14px}
.pl-reset b{font-variant-numeric:tabular-nums}
.pl-rec{margin-top:16px;padding:14px;border-radius:20px;text-align:left;border:1px solid rgba(52,86,77,.35);background:rgba(168,184,160,.18)}
.pl-rp{font:600 20px var(--f-d);letter-spacing:-.02em}
.pl-rp small{font:500 12px var(--f-b);color:var(--mute)}
.pl-cmp{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.pl-cmp>span:first-child{flex:1;color:var(--mute)}
.pl-from{color:var(--dim);font-variant-numeric:tabular-nums}
.pl-to{color:#34564D;font-variant-numeric:tabular-nums}

/* safety.css */
/* Safety & Emergency Center — every selector prefixed .saf- */
.saf-mt{margin-top:12px}
.saf-mb{margin-bottom:14px}
.saf-center{text-align:center}
.saf-free{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;color:#34564D;background:rgba(52,86,77,.1);border:1px solid rgba(52,86,77,.28)}
.saf-orb{flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:rgba(18,40,42,.05)}
.saf-orb.cyan{color:#34564D;background:rgba(52,86,77,.12)}
.saf-orb.violet{color:#34564D;background:rgba(168,184,160,.38)}
.saf-orb.amber,.saf-orb.lime{color:#6E5A40;background:rgba(184,165,141,.28)}
.saf-orb.red{color:#B4533F;background:rgba(180,83,63,.12)}
.saf-orb.pink{color:#12282A;background:rgba(18,40,42,.08)}
.saf-orb.dim{color:var(--mute);border-color:var(--stroke)}

/* ---------- hero hold button ---------- */
.saf-hero{text-align:center;padding:6px 0 6px}
.saf-hold-wrap{position:relative;width:236px;height:236px;margin:0 auto;display:grid;place-items:center}
.saf-hold-wrap::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(200,115,92,.16) 0,rgba(200,115,92,.07) 60%,transparent 72%);pointer-events:none}
.saf-ring{position:absolute;inset:24px;border-radius:50%;border:1.5px solid rgba(180,83,63,.28);animation:saf-ripple 4.8s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.saf-ring:nth-child(2){animation-delay:1.6s}
.saf-ring:nth-child(3){animation-delay:3.2s}
@keyframes saf-ripple{0%{transform:scale(.78);opacity:.8}100%{transform:scale(1.16);opacity:0}}
.saf-prog{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.saf-prog circle{fill:none;stroke-width:5}
.saf-prog .bg{stroke:rgba(180,83,63,.14)}
.saf-prog .fg{stroke:url(#safPg);stroke-linecap:round}
.saf-hold{position:relative;width:170px;height:170px;border-radius:50%;color:#F7F5EF;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 35% 28%,#C8735C 0,#B4533F 58%,#8E3A28 100%);
  box-shadow:0 0 0 8px rgba(180,83,63,.10),inset 0 2px 0 rgba(247,245,239,.22),inset 0 -12px 24px rgba(142,58,40,.45),0 16px 34px rgba(142,58,40,.28);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s}
.saf-hold:focus-visible{outline:3px solid #12282A;outline-offset:6px}
.saf-hold-wrap.holding .saf-hold{transform:scale(.95);box-shadow:0 0 0 12px rgba(180,83,63,.16),inset 0 -12px 24px rgba(142,58,40,.5),0 10px 26px rgba(142,58,40,.3)}
.saf-hold-wrap.holding .saf-ring{animation-duration:2s}
.saf-hold-in{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.saf-hold-in b{font:600 32px/1 var(--f-d);letter-spacing:.04em;margin-top:4px}
.saf-hold-in small{font-size:12.5px;font-weight:700;opacity:.92;min-height:17px;letter-spacing:.04em;text-transform:uppercase}
.saf-hint{margin:6px 0 2px;font-weight:700;font-size:15px;color:var(--ink);min-height:22px}
.saf-hint.warn{color:#8E3A28;animation:saf-shake .4s}
@keyframes saf-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.saf-sub{margin:0 auto;max-width:280px;color:var(--mute);font-size:13.5px;line-height:1.45}

/* ---------- status strip ---------- */
.saf-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.saf-st{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px;min-height:64px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--stroke);box-shadow:0 1px 2px rgba(18,40,42,.04);text-align:left}
.saf-st:active{background:#fff}
.saf-st-l{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--mute)}
.saf-st-l i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.saf-st-l i.ok{background:#34564D}
.saf-st-l i.warn{background:#B8A58D}
.saf-st-l i.live{background:#34564D;animation:saf-blink 1.6s infinite}
.saf-st-l i.bad{background:#B4533F;animation:saf-blink 1s infinite}
@keyframes saf-blink{50%{opacity:.35}}
.saf-st b{font:700 16px/1.2 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- quick actions ---------- */
.saf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saf-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;min-height:112px;border-radius:20px;text-align:left;background:rgba(255,255,255,.62);border:1px solid var(--stroke);box-shadow:0 1px 2px rgba(18,40,42,.04),0 8px 22px rgba(18,40,42,.05);transition:transform .15s,border-color .2s}
.saf-tile:active{transform:scale(.97)}
.saf-tile:hover{border-color:var(--stroke2)}
.saf-tile .saf-orb{margin-bottom:6px}
.saf-tile b{font-size:14.5px;font-weight:700;line-height:1.2}
.saf-tile small{font-size:12.5px;color:var(--mute);line-height:1.3}

/* ---------- activity ---------- */
.saf-when{display:flex;flex-direction:column;align-items:flex-end;font-size:12.5px;font-weight:800;color:var(--ink);flex:none}
.saf-when span{font-size:11px;font-weight:600;color:var(--dim)}
.saf-empty{display:flex;align-items:center;gap:14px;padding:16px;color:#34564D}
.saf-empty b{display:block;color:var(--ink);font-size:15px}
.saf-empty span{display:block;color:var(--mute);font-size:13px}
.saf-foot{display:flex;align-items:center;justify-content:center;gap:7px;margin:22px 0 0;color:var(--mute);font-size:13px;font-weight:600}
.saf-foot svg{color:#34564D}
.saf-demo-note{display:flex;align-items:center;justify-content:center;gap:5px;margin:14px 0 0;font-size:11.5px;color:var(--dim);font-weight:600}

/* ---------- sheets: helplines, tips ---------- */
.saf-line{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--stroke)}
.saf-line+.saf-line{margin-top:8px}
.saf-line.em{background:rgba(180,83,63,.09);border-color:rgba(180,83,63,.4)}
.saf-num{display:block;font:800 26px/1.1 var(--f-d);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.saf-line.em .saf-num{font-size:32px;color:#8E3A28}
.saf-line-t{display:block;font-weight:700;font-size:14px;margin-top:3px}
.saf-line-s{display:block;color:var(--mute);font-size:12.5px}
.saf-call{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#F7F5EF;background:#34564D;box-shadow:0 6px 16px rgba(52,86,77,.25)}
.saf-call.em{background:#B4533F;color:#F7F5EF;box-shadow:0 6px 16px rgba(180,83,63,.3)}
.saf-tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.saf-tips li{display:flex;gap:12px;padding:14px;border-radius:18px}
.saf-tip-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-d);color:#6E5A40;border:1px solid rgba(184,165,141,.55);background:rgba(184,165,141,.18)}
.saf-tips b{display:block;font-size:14.5px}
.saf-tips p{margin:2px 0 0;color:var(--mute);font-size:13.5px;line-height:1.45}

/* ---------- forms ---------- */
.saf-form{padding:16px;border-radius:20px;border-color:rgba(52,86,77,.25);box-shadow:0 8px 24px rgba(18,40,42,.08)}
.saf-form>.row{margin-bottom:12px}
.saf-form .field:last-of-type{margin-bottom:12px}
.saf-x{width:36px;height:36px}
.saf-err{margin:-4px 4px 12px;color:#8E3A28;font-size:13px;font-weight:700}
.input.saf-bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(180,83,63,.16)}
.saf-lbl{font-size:13px;font-weight:700;color:var(--mute);margin:16px 4px 8px}
.saf-inwrap{position:relative;display:block}
.saf-inwrap svg{position:absolute;left:15px;top:16px;color:#34564D;pointer-events:none}
.saf-inwrap .input{padding-left:42px}
.saf-ends{margin:8px 4px 0}
.saf-who{padding:10px 12px;border-radius:18px}
.saf-who b{display:block}
.saf-avs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.saf-avs::-webkit-scrollbar{display:none}
.saf-av{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
.saf-av .avatar,.saf-av-other{transition:box-shadow .2s}
.saf-av-other{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px dashed var(--stroke2);color:var(--ink)}
.saf-av.on{color:var(--ink)}
.saf-av.on .avatar,.saf-av.on .saf-av-other{box-shadow:0 0 0 2px #F7F5EF,0 0 0 4px #34564D}
.saf-none{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px}
.saf-none.warn{border-color:rgba(184,165,141,.6)}
.saf-none b{display:block;font-size:14.5px}
.saf-none span{display:block;color:var(--mute);font-size:13px}
.saf-trmini{display:flex;flex-wrap:wrap;gap:8px}
.saf-trmini .chip{color:#34564D;border-color:rgba(52,86,77,.3);background:rgba(52,86,77,.08)}

/* ---------- check-in pill (lives in status bar, like a live activity) ---------- */
.saf-pill{position:absolute;z-index:30;top:6px;left:50%;transform:translateX(-50%);height:32px;padding:0 13px 0 11px;border-radius:999px;display:flex;align-items:center;gap:7px;background:#34564D;border:1px solid rgba(247,245,239,.18);box-shadow:0 6px 18px rgba(18,40,42,.22);font-size:12.5px;font-weight:600;color:#F7F5EF;white-space:nowrap;animation:saf-pill-in .35s cubic-bezier(.2,.9,.3,1.2)}
.saf-pill[hidden]{display:none}
.saf-pill svg{color:#A8B8A0}
.saf-pill b{font-variant-numeric:tabular-nums;color:#F7F5EF;font-weight:700}
.saf-pill.over{background:#B4533F;border-color:rgba(247,245,239,.25);animation:saf-pill-pulse 1.6s infinite}
.saf-pill.over svg,.saf-pill.over b{color:#F7F5EF}
@keyframes saf-pill-in{from{opacity:0;transform:translateX(-50%) scale(.7)}}
@keyframes saf-pill-pulse{50%{box-shadow:0 0 0 5px rgba(180,83,63,.18),0 6px 18px rgba(18,40,42,.22)}}
.saf-cd-big{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;margin-bottom:14px}
.saf-cd-big b{font:600 40px/1.05 var(--f-d);font-variant-numeric:tabular-nums;color:#34564D;letter-spacing:-.02em}
.saf-cd-big .meter i{background:#34564D}
.saf-over-h{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px}
.saf-over-h h3{font-size:26px;margin:8px 0 0}
.saf-over-h p{margin:0}
.saf-alert-t{color:#8E3A28;font-weight:700;font-size:15px}
.saf-throb{border-radius:50%;animation:saf-throb 1.2s infinite}
@keyframes saf-throb{50%{box-shadow:0 0 0 9px rgba(180,83,63,.12)}}

/* ---------- big emergency buttons ---------- */
.saf-big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:0 22px;border-radius:999px;font:700 17px var(--f-b);transition:transform .12s}
.saf-big:active{transform:scale(.97)}
.saf-big+.saf-big{margin-top:10px}
.saf-big.light{background:#34564D;color:#F7F5EF;box-shadow:0 8px 22px rgba(52,86,77,.25)}
.saf-big.red{background:#B4533F;color:#F7F5EF;box-shadow:0 8px 22px rgba(180,83,63,.28)}
.saf-big.ghost{background:rgba(255,255,255,.6);border:1px solid rgba(18,40,42,.16);color:#12282A}

.saf-sos{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;color:#F7F5EF;
  background:radial-gradient(120% 50% at 50% 0%,rgba(180,83,63,.55),rgba(142,58,40,.18) 55%,transparent 80%),#12282A;
  animation:saf-fade .25s}
.saf-sos.saf-out,.saf-fake.saf-out{opacity:0;transition:opacity .2s}
@keyframes saf-fade{from{opacity:0}}
.saf-sos-cd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px 28px;text-align:center}
