.saf-live{display:inline-flex;white-space:nowrap;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(180,83,63,.3);border:1px solid rgba(200,115,92,.7);color:#F7F5EF}
.saf-live i{width:9px;height:9px;border-radius:50%;background:#C8735C;animation:saf-blink 1.2s infinite}
.saf-cd-ring{position:relative;width:200px;height:200px;margin:26px 0 18px;display:grid;place-items:center}
.saf-cd-ring svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.saf-cd-ring circle{fill:none;stroke-width:7}
.saf-cd-ring .bg{stroke:rgba(247,245,239,.14)}
.saf-cd-ring .fg{stroke:#F7F5EF;stroke-linecap:round}
.saf-cd-ring b{font:600 92px/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.saf-cd-t{font:600 25px/1.2 var(--f-d);margin:0 0 8px;letter-spacing:-.02em}
.saf-cd-s{margin:0 0 26px;color:rgba(247,245,239,.78);font-size:14.5px;max-width:300px}
.saf-sos-cd .saf-big{max-width:340px}
.saf-sos .saf-big.light{background:#F7F5EF;color:#12282A;box-shadow:none}
.saf-sos .saf-big.red{background:#B4533F;color:#F7F5EF;box-shadow:0 0 0 1px rgba(247,245,239,.18)}
.saf-sos .saf-big.ghost{background:transparent;border:1px solid rgba(247,245,239,.4);color:#F7F5EF}
.saf-discreet{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;margin-top:10px;padding:0 16px;font-size:14px;font-weight:600;color:rgba(247,245,239,.78);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(247,245,239,.35);align-self:center}
.saf-sos .saf-demo-note{color:rgba(247,245,239,.6)}
.saf-sos-scroll{flex:1;overflow-y:auto;padding:52px 18px 26px;display:flex;flex-direction:column;scrollbar-width:none}
.saf-sos-scroll::-webkit-scrollbar{display:none}
.saf-sos-scroll>*{flex-shrink:0}
.saf-sos-top{margin-bottom:14px}
.saf-tag{white-space:nowrap;font-size:11px;font-weight:700;color:rgba(247,245,239,.8);padding:6px 10px;border-radius:999px;background:rgba(247,245,239,.1);border:1px solid rgba(247,245,239,.18)}
.saf-callcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:rgba(180,83,63,.28);border:1px solid rgba(200,115,92,.7)}
.saf-call-ic{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#B4533F;color:#F7F5EF;box-shadow:0 0 0 6px rgba(200,115,92,.22);animation:saf-throb 1.6s infinite}
.saf-callcard small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(247,245,239,.78)}
.saf-call-n{display:block;font:600 36px/1 var(--f-d);margin:2px 0;letter-spacing:-.02em}
.saf-callcard span{font-size:12.5px;color:rgba(247,245,239,.78);white-space:nowrap}
.saf-call-t{align-self:flex-start;font:600 13px var(--f-b);padding:5px 9px;border-radius:999px;background:rgba(247,245,239,.14);font-variant-numeric:tabular-nums;color:#F7F5EF;flex:none}
.saf-sos .saf-loc{margin-top:12px;border-radius:22px;overflow:hidden;background:rgba(247,245,239,.08);border:1px solid rgba(247,245,239,.12)}
.saf-map{display:block;width:100%;height:150px}
.saf-ping{transform-box:fill-box;transform-origin:center;animation:saf-ping 2.2s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes saf-ping{from{transform:scale(1);opacity:1}to{transform:scale(3.6);opacity:0}}
.saf-loc-b{padding:12px 14px 14px}
.saf-loc-pin{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#F7F5EF;background:rgba(180,83,63,.55)}
.saf-loc-b b{display:block;font-size:15px}
.saf-loc-s{display:block;font-size:12.5px;color:rgba(247,245,239,.7)}
.saf-livechip{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.1em;padding:4px 8px;border-radius:6px;background:#B4533F;color:#F7F5EF}
.saf-loc-share{margin:10px 0 0;font-size:13.5px;font-weight:600;color:#F7F5EF}
.saf-sos .sec{color:rgba(247,245,239,.75)}
.saf-sos .list{background:rgba(247,245,239,.08);border-color:rgba(247,245,239,.14);color:#F7F5EF}
.saf-sos .item+.item{border-top-color:rgba(247,245,239,.1)}
.saf-sos .item .s{color:rgba(247,245,239,.7)}
.saf-sos .avatar{box-shadow:0 0 0 2px rgba(247,245,239,.25)}
.saf-sent{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:rgba(247,245,239,.7)}
.saf-sent.ok{color:#A8B8A0}
.saf-sos .saf-none,.saf-sos .saf-none.glass{background:rgba(247,245,239,.08);backdrop-filter:none;border-color:rgba(184,165,141,.5);color:#F7F5EF}
.saf-sos .saf-none span{color:rgba(247,245,239,.75)}
.saf-sos .saf-orb.amber{color:#E8E1D5;background:rgba(184,165,141,.3)}
.saf-sos .btn{background:rgba(247,245,239,.1);border-color:rgba(247,245,239,.3);color:#F7F5EF}
.saf-sos-actions{margin-top:20px}

/* ---------- fake call ---------- */
.saf-fake{position:absolute;inset:0;z-index:47;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:78px 24px 40px;text-align:center;color:#F7F5EF;background:radial-gradient(90% 50% at 50% 18%,rgba(52,86,77,.7),transparent 72%),#12282A;animation:saf-fade .25s}
.saf-fake-top{display:flex;flex-direction:column;align-items:center}
.saf-fake-k{font-size:14px;font-weight:600;color:rgba(247,245,239,.7);margin-bottom:24px}
.saf-fake-av{position:relative;display:grid;place-items:center}
.saf-fake-av i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(168,184,160,.45);animation:saf-ripple 2.4s ease-out infinite}
.saf-fake-av i+i{animation-delay:1.2s}
.saf-fake-av .avatar{font-size:42px}
.saf-fake h2{font:600 38px/1.1 var(--f-d);margin:22px 0 4px;letter-spacing:-.03em}
.saf-fake-s{font-size:16px;color:rgba(247,245,239,.7);font-variant-numeric:tabular-nums}
.saf-fake-script{margin:24px 0 0;max-width:280px;padding:12px 16px;border-radius:16px;background:rgba(247,245,239,.08);border:1px solid rgba(247,245,239,.14);color:rgba(247,245,239,.85);font-size:14px}
.saf-fake-btns{display:flex;justify-content:space-between;width:100%;max-width:300px}
.saf-fake-btns.one{justify-content:center}
.saf-fake-btns>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(247,245,239,.8)}
.saf-round{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#F7F5EF}
.saf-round.red{background:#B4533F}
.saf-round.red svg{transform:rotate(135deg)}
.saf-fake-btns.one .saf-round.red svg{transform:none}
.saf-round.green{background:#A8B8A0;color:#12282A;animation:saf-bob 1.4s ease-in-out infinite}
@keyframes saf-bob{50%{transform:translateY(-4px)}}
.saf-fake-note{margin:0;font-size:12px;color:rgba(247,245,239,.55)}

/* ---------- report ---------- */
.saf-rep-h{align-items:flex-start;margin-bottom:12px}
.saf-rep-h .icon-btn{width:40px;height:40px;margin-top:-2px}
.saf-rep-h h3{margin:0 0 4px}
.saf-rep-h p{margin:0}
.saf-steps{display:flex;gap:6px;margin:0 0 16px}
.saf-steps i{flex:1;height:4px;border-radius:2px;background:rgba(18,40,42,.1)}
.saf-steps i.on{background:#34564D}
.saf-rep .item .t{font-size:14.5px}
.saf-fast{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;color:#8E3A28;background:rgba(180,83,63,.12);border:1px solid rgba(180,83,63,.4)}
.saf-fast.big{height:28px;padding:0 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:#B4533F;color:#F7F5EF;border-color:transparent}
.saf-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 18px}
.saf-done h3{margin:4px 0 0;font-size:22px}
.saf-done p{margin:0;max-width:320px}
.saf-done-ic{border-radius:50%;margin-bottom:4px}
.saf-urgent{padding:14px;border-radius:22px;margin-bottom:8px;background:rgba(180,83,63,.08);border:1px solid rgba(180,83,63,.4)}
.saf-urgent-t{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35;margin:0 2px 12px;color:#12282A}
.saf-urgent-t svg{flex:none;color:#B4533F;margin-top:1px}
.saf-urgent .saf-line{background:#F7F5EF}

/* ---------- trusted screen ---------- */
.saf-count{font:700 13px var(--f-d);padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--stroke)}
.saf-intro{display:flex;gap:14px;padding:16px;border-radius:22px;border-color:rgba(52,86,77,.18)}
.saf-intro b{display:block;font-size:15px;margin-bottom:6px}
.saf-intro ul{margin:0;padding-left:18px;color:var(--mute);font-size:13.5px;line-height:1.5}
.saf-intro li+li{margin-top:4px}
.saf-intro strong{color:var(--ink)}
.saf-tlist{display:flex;flex-direction:column;gap:10px}
.saf-tc{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px}
.saf-tc b{font-size:15px}
.saf-tc-n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saf-tc-s{display:block;margin-top:2px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-variant-numeric:tabular-nums}
.saf-rel{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#34564D;background:rgba(168,184,160,.3);border:1px solid rgba(168,184,160,.8)}
.saf-tc .icon-btn{width:40px;height:40px}
.saf-del{color:#B4533F}
.saf-hold-wrap.holding .saf-hold-in small{font-size:17px}

/* threads.css */
/* Threads screens — all selectors prefixed .thr- */
.thr-tabs{flex:none;padding:0 18px 10px}
.thr-scroll{padding:0 0 130px}
.thr-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.thr-chips::-webkit-scrollbar{display:none}
.thr-chips .chip{flex:none;min-height:38px;scroll-snap-align:start}
.thr-chips.wrap{flex-wrap:wrap;overflow:visible}
.thr-chips .chip.thr-par{border-color:rgba(184,165,141,0.35)}
.thr-chips .chip.thr-par.on{background:rgba(184,165,141,0.28);border-color:#B8A58D;color:#4A3B26;box-shadow:none}
.thr-chips .chip svg{flex:none}

/* post row */
.thr-post{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:14px 18px 6px;border-top:1px solid rgba(18,40,42,0.08);position:relative;transition:background .2s;-webkit-user-select:none;user-select:none}
.thr-post:first-child{border-top:0}
.thr-post:active{background:rgba(18,40,42,0.017)}
.thr-left{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:6px}
.thr-av{border-radius:50%;flex:none;display:block}
.thr-av:active{transform:scale(.95)}
.thr-line{flex:1;width:2px;min-height:14px;border-radius:2px;background:linear-gradient(180deg,rgba(18,40,42,0.154),rgba(18,40,42,0.042))}
.thr-cluster{display:flex;margin-top:2px;height:22px;align-items:center}
.thr-cluster span{margin-left:-6px;border-radius:50%;box-shadow:0 0 0 2px #F7F5EF;display:flex}
.thr-cluster span:first-child{margin-left:0}
.thr-main{min-width:0}
.thr-head{display:flex;align-items:center;gap:6px;min-height:24px}
.thr-name{font-weight:800;font-size:15px;color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;padding:2px 0}
.thr-name.static{max-width:none}
.thr-badges{display:inline-flex;gap:4px;align-items:center;min-width:0}
.thr-badges .badge{height:18px;font-size:10px;padding:0 6px;gap:3px}
.thr-badges .badge.verified{font-size:0;padding:0 5px;gap:0}
.thr-time{margin-left:auto;color:var(--dim);font-size:13px;font-weight:600;flex:none}
.thr-more{width:34px;height:34px;margin:-6px -8px -6px -2px;display:grid;place-items:center;color:var(--dim);border-radius:50%;flex:none;position:relative}
.thr-more::after{content:"";position:absolute;inset:-5px}
.thr-more:active{background:var(--glass2)}
.thr-circrow{margin:1px 0 4px}
.thr-circ{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;color:#34564D;background:rgba(168,184,160,0.28);border:1px solid rgba(168,184,160,0.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr-circ.par{color:#6E5A40;background:rgba(184,165,141,0.22);border-color:rgba(184,165,141,0.7)}
.thr-text{font-size:15.5px;line-height:1.5;color:#12282A;white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 2px;cursor:pointer;-webkit-user-select:text;user-select:text}
.thr-acts{display:flex;gap:2px;margin:4px 0 0 -10px}
.thr-act{display:inline-flex;align-items:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border-radius:22px;color:var(--mute);font-weight:700;font-size:13px;transition:color .2s}
.thr-act b{font-weight:700;min-width:8px;font-variant-numeric:tabular-nums}
.thr-act:active{background:var(--glass)}
.thr-act.like.on{color:#34564D}
.thr-act.like.on svg{fill:#34564D;filter:none}
.thr-act.like.pop svg{animation:thrPop .5s cubic-bezier(.2,.9,.3,1.6)}
.thr-act.rep.on{color:#34564D}
.thr-act.rep.on svg{filter:none;stroke-width:2.6}
@keyframes thrPop{0%{transform:scale(.6)}45%{transform:scale(1.4) rotate(-8deg)}100%{transform:scale(1)}}
.thr-foot{margin:-4px 0 8px}
.thr-foot button{color:var(--dim);font-size:13px;font-weight:600;min-height:32px}
.thr-end{text-align:center;color:var(--dim);font-size:12.5px;font-weight:600;padding:26px 0 8px;border-top:1px solid rgba(18,40,42,0.049)}

/* pill */
.thr-pill{position:absolute;z-index:15;top:178px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:#34564D;color:#F7F5EF;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(18,40,42,0.18);animation:thrDrop .45s cubic-bezier(.2,.9,.3,1.3)}
.thr-pill[hidden]{display:none}
@keyframes thrDrop{from{opacity:0;transform:translate(-50%,-16px) scale(.9)}}

/* detail */
.thr-dscroll{padding-bottom:190px}
.thr-post.detail{padding-top:6px;border-top:0}
.thr-post.detail .thr-text{font-size:18px;line-height:1.5;cursor:default;margin:6px 0 4px}
.thr-post.detail .thr-name{font-size:16px}
.thr-stats{display:flex;gap:18px;padding:10px 18px 14px 72px;color:var(--mute);font-size:13px;font-weight:600;border-bottom:1px solid rgba(18,40,42,0.08)}
.thr-stats b{color:var(--ink)}
.thr-who{display:flex;gap:6px;align-items:center;margin:2px 18px 6px 72px;font-size:12.5px;color:#6E5A40;font-weight:700}
.thr-rhead{font:700 12.5px var(--f-b);color:var(--mute);padding:16px 18px 4px}
.thr-reply{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:12px 18px 10px}
.thr-reply .thr-left{align-items:center}
.thr-reply .thr-text{cursor:default}
.thr-noreply{text-align:center;color:var(--mute);padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.thr-noreply b{color:var(--ink);font:700 16px var(--f-d);margin-top:8px}
.thr-composer{position:absolute;z-index:18;left:12px;right:12px;bottom:96px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:999px;background:rgba(247,245,239,0.88);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(18,40,42,0.1);box-shadow:0 8px 24px rgba(18,40,42,0.10)}
.thr-composer:focus-within{border-color:#34564D;box-shadow:0 8px 24px rgba(18,40,42,0.10),0 0 0 3px rgba(52,86,77,0.15)}
.thr-composer.lock{opacity:.7}
.thr-input{flex:1;height:40px;background:none;border:0;outline:0;font-size:16px;color:var(--ink)}
.thr-input::placeholder{color:var(--dim)}
.thr-send{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#34564D;color:#F7F5EF;box-shadow:none;transition:opacity .2s,transform .12s}
.thr-send:active{transform:scale(.92)}
.thr-send[disabled]{opacity:.35;box-shadow:none}

/* sheet rows */
.thr-sico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--glass2);color:var(--ink)}
.thr-sico.bad{background:rgba(180,83,63,0.14);color:var(--red)}
.sheet .item{min-height:60px}
.sheet .item .t{display:block}

/* compose */
.thr-ctop{justify-content:space-between;padding-top:4px}
.thr-ctitle{text-align:center;font:700 16px var(--f-d)!important;flex:1}
.thr-cscroll{padding:6px 18px 40px}
.thr-cbody{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:8px 0}
.thr-cbody .thr-left{padding-bottom:0}
.thr-cbody .thr-line{background:linear-gradient(180deg,rgba(18,40,42,0.14),rgba(18,40,42,0.0));min-height:80px}
.thr-ta{width:100%;background:none;border:0;outline:0;resize:none;font-size:18px;line-height:1.45;padding:6px 0;min-height:140px;caret-color:#34564D;color:var(--ink)}
.thr-ta::placeholder{color:var(--dim)}
.thr-warn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(184,165,141,0.22);border:1px solid rgba(184,165,141,0.7);color:#6E5A40;font-size:13px;font-weight:700;margin:4px 0 8px}
.thr-warn[hidden]{display:none}
.thr-count{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--dim);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.thr-hint{display:flex;gap:8px;align-items:flex-start;margin:18px 4px 0}
.thr-hint svg{flex:none;margin-top:3px;color:#34564D}

/* circle */
.thr-chead{margin:4px 18px 0;padding:20px 18px 18px;position:relative;overflow:hidden;border-color:rgba(168,184,160,0.8);background:rgba(255,255,255,.6);box-shadow:0 8px 24px rgba(18,40,42,0.06)}
.thr-chead::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(168,184,160,0.5),transparent 70%);pointer-events:none}
.thr-chead.par{border-color:rgba(184,165,141,0.85);box-shadow:0 8px 24px rgba(18,40,42,0.06)}
.thr-chead.par::before{background:radial-gradient(circle,rgba(184,165,141,0.45),transparent 70%)}
.thr-chead>*{position:relative}
.thr-cname{font:700 24px/1.15 var(--f-d);letter-spacing:-.02em;margin:14px 0 6px}
.thr-cblurb{margin:0 0 16px;font-size:14.5px}
.thr-cmem{display:flex;align-items:center;gap:7px;font-size:14px}
.thr-cmem b{font-weight:800}
.thr-chead .btn.sm{min-height:44px;padding:0 20px}
.thr-bump{animation:thrPop .5s cubic-bezier(.2,.9,.3,1.6)}
.thr-sec{font:700 12.5px var(--f-b);color:var(--mute);margin:22px 22px 8px}
.thr-fab{position:absolute;z-index:18;right:18px;bottom:96px;box-shadow:0 8px 24px rgba(18,40,42,0.18)}
.thr-chips.wrap{padding:0 0 4px}
#cWho button{white-space:nowrap;padding:0 4px;font-size:13px}
[data-screen=circle] #thrList{padding-bottom:76px}

<script>
/* Padres core — namespace, state, plan engine, router, UI kit. Screens live in src/screens/*.js */
window.P = window.P || {};
(function (P) {
  'use strict';
  /* ---------------- utils ---------------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const month = () => new Date().toISOString().slice(0, 7);
  const uid = () => Math.random().toString(36).slice(2, 9);
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function ago(ts) {
    const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
    if (m < 1) return 'now'; if (m < 60) return m + 'm'; const h = Math.round(m / 60);
    if (h < 24) return h + 'h'; return Math.round(h / 24) + 'd';
  }
  function clock(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  P.util = { $, $$, esc, today, month, uid, hash, ago, clock };

  /* ---------------- events ---------------- */
  const bus = {};
  P.on = (e, fn) => { (bus[e] = bus[e] || []).push(fn); return () => { bus[e] = bus[e].filter(f => f !== fn); }; };
  P.emit = (e, d) => (bus[e] || []).slice().forEach(fn => { try { fn(d); } catch (err) { console.error(err); } });

  /* ---------------- state ---------------- */
  const KEY = 'padres.v1';
  function fresh() {
    return {
      onboarded: false,
      user: {
        id: 'me', name: '', age: 27, gender: '', country: 'BD', city: 'Dhaka', area: 'Gulshan',
        bio: '', job: '', prompts: [], interests: [], languages: ['English', 'Bangla'], lookingFor: ['Friends'],
        single: true, dateOn: true, verified: false, hues: [320, 260],
        parent: { on: false, kidsCount: 1, ages: [], about: '', visibility: 'matches' }
      },
      mode: 'friends',
      plan: 'free',
      usage: { day: today(), swipes: 0, supers: 0 },
      boosts: { month: month(), used: 0, activeUntil: 0 },
      global: { month: month(), used: 0, bought: 0, activeUntil: 0 },
      filters: { ageMin: 21, ageMax: 50, maxKm: 25, parentsOnly: false, verifiedOnly: false, interests: [] },
      liked: { friends: [], date: [] }, passed: { friends: [], date: [] }, superLiked: [],
      matches: [],           // {id, mode:'friends'|'date', at}
      chats: {},             // id -> [{id, from:'me'|'them'|'system', kind:'text'|'voice'|'meetup'|'system', text, meta, at}]
      unread: {},            // id -> n
      posts: [],             // user's own thread posts
      postLikes: [], reposts: [], postReplies: {}, // postId -> [{author, text, at}]
      joinedCircles: [],
      trusted: [],           // {id, name, phone, relation}
      checkin: null,         // {until, withId, place, startedAt}
      sosLog: [], reports: [], blocked: [],
      settings: { showDistance: true, readReceipts: true, incognito: false, notifyMatches: true }
    };
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
    return fresh();
  }
  P.state = load();
  P.save = () => { try { localStorage.setItem(KEY, JSON.stringify(P.state)); } catch (e) { } P.emit('state'); };
  P.reset = () => { document.querySelectorAll('.phone > .overlay, .phone > .sheet, .phone > .modal, .saf-sos, .saf-fake, .saf-pill').forEach(n => n.remove()); try { localStorage.removeItem(KEY); } catch (e) { } P.state = fresh(); P.seedState && P.seedState(); P.save(); P.start(); };

  /* ---------------- plan engine ---------------- */
  const LIMITS = {
    free: { label: 'Free', swipes: 15, supers: 1, boosts: 0, filters: false, includedPasses: 0, seeLikes: false, ads: 'Yes', globalNote: 'Buy passes at full price' },
    general: { label: 'General', swipes: 50, supers: 3, boosts: 2, filters: true, includedPasses: 1, seeLikes: false, ads: 'Reduced', globalNote: '1 pass / month + passes 33% off' },
    premium: { label: 'Premium', swipes: 120, supers: 5, boosts: 8, filters: true, includedPasses: 7, seeLikes: true, ads: 'None', globalNote: '7 days / month + passes 67% off' }
  };
  const PRICES = {
    BD: { cur: 'Tk ', free: 0, general: 249.99, premium: 499.99, pass: { free: 299.99, general: 199.99, premium: 99.99 }, emergency: '999', child: '1098', childName: 'National Child Helpline' },
    UK: { cur: '£', free: 0, general: 5.99, premium: 8.99, pass: { free: 2.99, general: 1.99, premium: 0.99 }, emergency: '999', child: '0808 800 5000', childName: 'NSPCC Helpline' }
  };
  function roll() {
    const s = P.state;
    if (s.usage.day !== today()) s.usage = { day: today(), swipes: 0, supers: 0 };
    if (s.boosts.month !== month()) s.boosts = { month: month(), used: 0, activeUntil: s.boosts.activeUntil };
    if (s.global.month !== month()) s.global = { month: month(), used: 0, bought: 0, activeUntil: s.global.activeUntil };
  }
  P.plan = {
    LIMITS, PRICES,
    cur() { return LIMITS[P.state.plan]; },
    table() { return PRICES[P.state.user.country] || PRICES.BD; },
    /* pass = Global Pass price for the CURRENT plan (cheaper on higher plans) */
    prices() { const t = this.table(); return Object.assign({}, t, { pass: t.pass[P.state.plan] }); },
    passPrice(plan) { const t = this.table(); return t.cur + t.pass[plan || P.state.plan].toFixed(2); },
    passSaving(plan) { const t = this.table().pass; return Math.round((1 - t[plan || P.state.plan] / t.free) * 100); },
    price(plan) { const p = this.table(); const v = p[plan]; return v == null ? '—' : v === 0 ? p.cur + '0' : p.cur + v.toFixed(2); },
    swipesLeft() { roll(); return Math.max(0, this.cur().swipes - P.state.usage.swipes); },
    useSwipe() { roll(); if (this.swipesLeft() <= 0) return false; P.state.usage.swipes++; P.save(); return true; },
    supersLeft() { roll(); return Math.max(0, this.cur().supers - P.state.usage.supers); },
    useSuper() { roll(); if (this.supersLeft() <= 0) return false; P.state.usage.supers++; P.save(); return true; },
    boostsLeft() { roll(); return Math.max(0, this.cur().boosts - P.state.boosts.used); },
    boostActive() { return P.state.boosts.activeUntil > Date.now(); },
    useBoost() { if (this.boostsLeft() <= 0 || this.boostActive()) return false; P.state.boosts.used++; P.state.boosts.activeUntil = Date.now() + 30 * 60000; P.save(); return true; },
    /* Global access: each credit = 24h outside your country */
    globalCredits() { roll(); const inc = this.cur().includedPasses; return Math.max(0, inc + P.state.global.bought - P.state.global.used); },
    globalActive() { return P.state.global.activeUntil > Date.now(); },
    canBuyPass() { return true; },
    buyPass() { if (!this.canBuyPass()) return false; P.state.global.bought++; P.save(); return true; },
    activateGlobal() { if (this.globalActive() || this.globalCredits() <= 0) return false; P.state.global.used++; P.state.global.activeUntil = Date.now() + 24 * 3600000; P.save(); return true; },
    setPlan(plan) { if (!LIMITS[plan]) return; P.state.plan = plan; P.save(); P.emit('plan', plan); },
    msToReset() { const d = new Date(); d.setHours(24, 0, 0, 0); return d - Date.now(); }
  };

  /* ---------------- people & matching ---------------- */
  P.person = (id) => id === 'me' ? P.state.user : (P.data.people || []).find(p => p.id === id);
  P.people = () => (P.data.people || []).filter(p => !P.state.blocked.includes(p.id));
  P.isMatch = (id) => P.state.matches.some(m => m.id === id);
  P.matchOf = (id) => P.state.matches.find(m => m.id === id);
  /* Candidates for a deck. Applies mode, country/global, block, already-seen, and saved filters. */
  P.deck = (mode) => {
    const s = P.state, f = s.filters, me = s.user, global = P.plan.globalActive();
    const seen = new Set([...s.liked[mode], ...s.passed[mode], ...s.matches.map(m => m.id)]);
    return P.people().filter(p => {
      if (seen.has(p.id)) return false;
      if (!global && p.country !== me.country) return false;
      if (mode === 'date' && !p.dateOn) return false;
      if (p.age < f.ageMin || p.age > f.ageMax) return false;
      if (p.country === me.country && p.distanceKm > f.maxKm && !global) return false;
      if (f.parentsOnly && !p.parent) return false;
      if (f.verifiedOnly && !p.bgChecked) return false;
      if (f.interests.length && !f.interests.some(i => p.interests.includes(i))) return false;
      return true;
    }).sort((a, b) => P.score(b) - P.score(a));
  };
  /* compatibility: shared interests, languages, parent status, distance */
  P.why = (p) => {
    const me = P.state.user, out = [];
    const shared = p.interests.filter(i => me.interests.includes(i));
    shared.slice(0, 2).forEach(i => out.push(i));
    if (me.parent.on && p.parent) out.push('Both parents');
    const lang = p.languages.find(l => me.languages.includes(l) && l !== 'English');
    if (lang) out.push('Speaks ' + lang);
    if (p.country === me.country && p.distanceKm <= 3) out.push('Lives nearby');
    if (p.country !== me.country) out.push('Global match');
    return out.slice(0, 3);
  };
  P.score = (p) => P.why(p).length * 10 + (p.likesYou ? 5 : 0) - (p.distanceKm || 0) / 5;
  /* returns {ok:false, reason:'limit'} | {ok:true, matched:bool} */
  P.like = (id, mode, opts = {}) => {
    if (opts.super) { if (!P.plan.useSuper()) return { ok: false, reason: 'super' }; }
    if (!P.plan.useSwipe()) { if (opts.super) { P.state.usage.supers--; P.save(); } return { ok: false, reason: 'limit' }; }
    const s = P.state; s.liked[mode].push(id); if (opts.super) s.superLiked.push(id);
    const p = P.person(id);
    const matched = !!(p && (p.likesYou || opts.super && hash(id) % 2 === 0));
    if (matched && !P.isMatch(id)) {
      s.matches.unshift({ id, mode, at: Date.now() });
      s.chats[id] = s.chats[id] || [];
      s.chats[id].push({ id: uid(), from: 'system', kind: 'system', text: 'You matched' + (mode === 'date' ? ' on Date' : ' as Friends') + '. Say hi — keep chats in Padres for your safety.', at: Date.now() });
    }
    P.save(); if (matched) P.emit('match', { id, mode });
    return { ok: true, matched };
  };
  P.pass = (id, mode) => { if (!P.plan.useSwipe()) return { ok: false, reason: 'limit' }; P.state.passed[mode].push(id); P.save(); return { ok: true }; };
  P.unmatch = (id) => { const s = P.state; s.matches = s.matches.filter(m => m.id !== id); delete s.chats[id]; delete s.unread[id]; P.save(); };
  P.block = (id) => { const s = P.state; if (!s.blocked.includes(id)) s.blocked.push(id); s.matches = s.matches.filter(m => m.id !== id); delete s.unread[id]; P.save(); P.emit('blocked', id); };

  /* ---------------- chat ---------------- */
  P.chat = {
    list(id) { return P.state.chats[id] || []; },
    push(id, msg) {
      const m = Object.assign({ id: uid(), from: 'me', kind: 'text', at: Date.now() }, msg);
      (P.state.chats[id] = P.state.chats[id] || []).push(m);
      if (m.from === 'them' && !(P.current().name === 'chat' && (P.current().params || {}).id === id)) P.state.unread[id] = (P.state.unread[id] || 0) + 1;
      P.save(); P.emit('chat', { id, msg: m }); return m;
    },
    /* user sends; returns the stored message (text may be masked) */

  /* =========================== CHAT =========================== */
  P.screens.chat = {
    tab: false,
    render(el, params) {
      const id = params.id, p = P.person(id);
      if (!p) { el.innerHTML = P.ui.topbar('Chat', { back: true }) + '<div class="empty"><b>Conversation not found</b></div>'; return; }
      const m0 = P.matchOf(id), blocked = P.state.blocked.includes(id), live = !!m0 && !blocked;
      const timers = new Set(); let closeSheet = null;
      const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
      const parentOk = () => !!(P.state.user.parent && P.state.user.parent.on && p.parent);

      el.innerHTML = `
        <div class="msg-head">
          <button class="icon-btn" data-back aria-label="Back" style="background:transparent;border-color:transparent">${P.icon('back')}</button>
          <button class="msg-who" data-prof aria-label="View ${esc(p.name)}'s profile">${P.avatar(p, 42, { online: p.online })}
            <span><span class="msg-nm2">${esc(p.name.split(' ')[0])}${m0 ? tag(m0.mode) : ''}${p.parent ? '<span class="badge parent">Parent</span>' : ''}</span>
            <span class="msg-act${p.online ? ' on' : ''}">${esc(lastActive(p))}</span></span></button>
          <button class="icon-btn" data-safe aria-label="Safety options" style="color:#34564D">${P.icon('shieldCheck', 22)}</button>
        </div>
        <div class="msg-scroll"><div class="msg-list"></div>
          <div class="msg-row them msg-typing first" aria-label="${esc(p.name)} is typing"><div class="msg-bub"><i></i><i></i><i></i></div></div></div>
        <div class="msg-moves" hidden></div>
        ${live ? `<div class="msg-comp">
          <button class="icon-btn" data-plus aria-label="More actions">${P.icon('plus', 22)}</button>
          <div class="msg-in"><input type="text" placeholder="Message ${esc(p.name.split(' ')[0])}" autocomplete="off" enterkeyhint="send" aria-label="Message">
            <div class="msg-rec"><b></b>Recording <em style="font-style:normal" data-rt>0:00</em><span>Release to send</span></div></div>
          <button class="msg-go msg-mic" data-mic aria-label="Hold to record a voice note">${P.icon('mic', 22)}</button>
          <button class="msg-go" data-send hidden aria-label="Send">${P.icon('send', 20)}</button></div>`
        : `<div class="msg-comp off">${P.icon('lock', 18)}<span>${blocked ? 'You blocked this person. Unblock from Settings to message them.' : 'You are not matched with this person, so messaging is off.'}</span></div>`}`;

      const scroll = $('.msg-scroll', el), list = $('.msg-list', el), typing = $('.msg-typing', el);
      const toBottom = (smooth) => requestAnimationFrame(() => scroll.scrollTo({ top: scroll.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }));
      const sepNeeded = (a, b) => !a || b.at - a.at > 30 * 60000;
      const grouped = (a, b) => !!a && !!b && a.from === b.from && a.from !== 'system' && b.from !== 'system' && b.at - a.at < 5 * 60000 && !sepNeeded(a, b);
      const bars = (m) => { const s = P.util.hash(m.id || 'x'); return Array.from({ length: 26 }, (_, i) => 5 + ((s >> (i % 20)) ^ (i * 7)) % 20); };
      const voices = {};

      function msgHtml(m, prev, next, animate) {
        let h = '';
        if (sepNeeded(prev, m)) {
          const sameDay = prev && dayLabel(prev.at) === dayLabel(m.at);
          h += `<div class="msg-sep">${!sameDay || !prev ? esc(dayLabel(m.at)) + ' · ' : ''}${esc(P.util.clock(m.at))}</div>`;
        }
        if (m.from === 'system' || m.kind === 'system') return h + `<div class="msg-sys"><span>${P.icon('lock', 14)}<span>${esc(m.text)}</span></span></div>`;
        const g = grouped(prev, m), cls = `msg-row ${m.from === 'me' ? 'me' : 'them'}${g ? '' : ' first'}${grouped(m, next) ? '' : ' last'}`;
        const st = animate ? '' : ' style="animation:none"';
        let inner;
        if (m.kind === 'voice') {
          const secs = (m.meta && m.meta.secs) || 6;
          inner = `<div class="msg-bub msg-voice"><button class="msg-play" data-play="${esc(m.id)}" aria-label="Play voice note">${P.icon('play', 18)}</button>
            <div class="msg-wave">${bars(m).map(v => `<i style="height:${v}px"></i>`).join('')}</div><span class="msg-vt">${mmss(secs)}</span></div>`;
        } else if (m.kind === 'meetup') {
          const mt = m.meta || {}, pd = !!mt.playdate;
          inner = `<div class="msg-meet${pd ? ' play' : ''}"><div class="mh"><span class="mi">${P.icon(pd ? 'smile' : 'calendar', 22)}</span>
            <div><div class="mt">${pd ? 'Playdate proposal' : 'Meetup proposal'}</div><div class="ms">${m.from === 'me' ? 'You suggested' : esc(p.name.split(' ')[0]) + ' suggested'} a public place</div></div></div>
            ${mt.place ? `<div class="ml">${P.icon('pin', 16)}<span>${esc(mt.place)}</span></div>` : ''}
            ${mt.when ? `<div class="ml">${P.icon('clock', 16)}<span>${esc(fmtWhen(mt.when))}</span></div>` : ''}
            ${mt.note ? `<p class="mn">${esc(mt.note)}</p>` : ''}
            <div class="mb"><button class="btn primary" data-go="${esc(m.id)}">${P.icon('shieldCheck', 17)} I'm going — start check-in</button>
            <button class="btn ghost" data-alt="${esc(m.id)}">Suggest another time</button></div></div>`;
        } else inner = `<div class="msg-bub">${esc(m.text)}</div>`;
        if (m.from === 'me' && m.meta && m.meta.flagged) {
          const k = m.meta.flagged.filter(x => HIDE_KINDS.includes(x));
          if (k.length) inner += `<div class="msg-flag">${P.icon('alert', 13)}<span>Hidden: ${esc(k.join(', '))} — keep chats in Padres</span></div>`;
        }
        return h + `<div class="${cls}" data-mid="${esc(m.id)}"${st}>${inner}</div>`;
      }
      function paintAll() {
        const c = P.chat.list(id);
        list.innerHTML = c.map((m, i) => msgHtml(m, c[i - 1], c[i + 1], false)).join('');
      }
      function append(m) {
        const c = P.chat.list(id), i = c.indexOf(m), prev = c[i - 1];
        if (grouped(prev, m)) { const rows = $$('.msg-row', list), r = rows[rows.length - 1]; if (r) r.classList.remove('last'); }
        list.insertAdjacentHTML('beforeend', msgHtml(m, prev, null, true));
        toBottom(true);
      }

      /* voice playback */
      function stopVoice(mid) {
        const v = voices[mid]; if (!v) return; clearInterval(v.t); timers.delete(v.t); delete voices[mid];
        const row = $(`[data-mid="${CSS.escape(mid)}"]`, list); if (!row) return;
        $$('.msg-wave i', row).forEach(i => i.classList.remove('on'));
        $('.msg-play', row).innerHTML = P.icon('play', 18); $('.msg-vt', row).textContent = mmss(v.secs);
      }
      function playVoice(mid) {
        if (voices[mid]) return stopVoice(mid);
        Object.keys(voices).forEach(stopVoice);
        const m = P.chat.list(id).find(x => x.id === mid), row = $(`[data-mid="${CSS.escape(mid)}"]`, list); if (!m || !row) return;
        const secs = (m.meta && m.meta.secs) || 6, t0 = Date.now(), wv = $$('.msg-wave i', row), vt = $('.msg-vt', row);
        $('.msg-play', row).innerHTML = P.icon('x', 18);
        const t = setInterval(() => {
          const el2 = (Date.now() - t0) / 1000, pr = Math.min(1, el2 / secs), n = Math.floor(pr * wv.length);
          wv.forEach((b, i) => b.classList.toggle('on', i < n)); vt.textContent = mmss(Math.max(0, secs - el2));
          if (pr >= 1) stopVoice(mid);
        }, 100);
        timers.add(t); voices[mid] = { t, secs };

      const movesEl = $('.msg-moves', el), input = $('.msg-in input', el);
      function paintMoves() {
        const n = real(P.chat.list(id)).length;

        $$('[data-mv]', movesEl).forEach(b => b.onclick = () => { input.value = b.dataset.mv; input.focus(); sync(); });
      }

      /* initial paint */
      P.chat.markRead(id); paintAll(); paintMoves(); toBottom(false);

      /* events */
      const offs = [];
      offs.push(P.on('chat', (d) => {
        if (d.id !== id) return;
        if (P.state.unread[id]) P.chat.markRead(id);
        if (!$(`[data-mid="${CSS.escape(d.msg.id)}"]`, list)) append(d.msg);
        paintMoves();
      }));
      offs.push(P.on('typing', (d) => { if (d.id !== id) return; typing.classList.toggle('show', !!d.on); if (d.on) toBottom(true); }));

      list.addEventListener('click', (e) => {
        const pl = e.target.closest('[data-play]'); if (pl) return playVoice(pl.dataset.play);
        const go = e.target.closest('[data-go]'), alt = e.target.closest('[data-alt]');
        if (go) { const m = P.chat.list(id).find(x => x.id === go.dataset.go); P.openCheckin ? P.openCheckin(id, m && m.meta && m.meta.place) : P.ui.toast('Check-in is coming soon'); }
        if (alt) { const m = P.chat.list(id).find(x => x.id === alt.dataset.alt); P.openMeetup ? P.openMeetup(id, { playdate: !!(m && m.meta && m.meta.playdate) }) : P.ui.toast('Meetups are coming soon'); }
      });
      $('[data-prof]', el).onclick = () => P.go('profile', { id });

      /* safety sheet */
      $('[data-safe]', el).onclick = () => {
        const tips = (P.data.safetyTips || []).slice(0, 3);
        closeSheet = P.ui.sheet(`<h3>Stay safe with ${esc(p.name.split(' ')[0])}</h3><p class="muted small" style="margin:0 0 12px">Safety tools are free for everyone.</p>
          <div class="list">
            <button class="item" data-a="checkin"><span style="color:#6E5A40">${P.icon('clock', 22)}</span><span class="t">Start check-in timer<span class="s">Trusted contacts are alerted if you do not check in</span></span>${P.icon('chev', 18)}</button>
            <button class="item" data-a="report"><span style="color:#6E5A40">${P.icon('flag', 22)}</span><span class="t">Report</span>${P.icon('chev', 18)}</button>
            ${live ? `<button class="item" data-a="block"><span style="color:var(--red)">${P.icon('x', 22)}</span><span class="t">Block</span>${P.icon('chev', 18)}</button>
            <button class="item" data-a="unmatch"><span style="color:var(--mute)">${P.icon('trash', 22)}</span><span class="t">Unmatch</span>${P.icon('chev', 18)}</button>` : ''}</div>
          ${tips.length ? `<div class="sec" style="margin-left:2px">Safe-dating tips</div>` + tips.map(t => `<div class="msg-tip">${P.icon('check', 16, 3)}<span><b>${esc(t.title)}.</b> ${esc(t.text)}</span></div>`).join('') : ''}`, (sh, close) => {
          $$('[data-a]', sh).forEach(b => b.onclick = async () => {
            const a = b.dataset.a; close();
            if (a === 'checkin') P.openCheckin ? P.openCheckin(id) : P.ui.toast('Check-in is coming soon');
            else if (a === 'report') P.openReport ? P.openReport(id) : P.ui.toast('Report is coming soon');
            else if (a === 'block') { if (await P.ui.confirm('Block ' + p.name.split(' ')[0] + '?', 'They will not be able to find or message you. The conversation is kept as evidence if you report.', 'Block', true)) { P.block(id); P.ui.toast('Blocked. You will not see ' + p.name.split(' ')[0] + ' again.', 'good'); P.tab('messages'); } }
            else if (a === 'unmatch') { if (await P.ui.confirm('Unmatch ' + p.name.split(' ')[0] + '?', 'This removes the match and the conversation for you.', 'Unmatch', true)) { P.unmatch(id); P.ui.toast('Unmatched'); P.tab('messages'); } }
          });
        });
      };

      if (!live) return () => { offs.forEach(f => f()); timers.forEach(t => { clearTimeout(t); clearInterval(t); }); };

      /* composer */
      const comp = $('.msg-comp', el), sendBtn = $('[data-send]', el), micBtn = $('[data-mic]', el);
      function sync() { const has = !!input.value.trim(); sendBtn.hidden = !has; micBtn.hidden = has; }
      input.addEventListener('input', sync);
      function doSend() {
        const text = input.value.trim(); if (!text) return;
        const scan = P.safety.scan(text);
        const masked = scan.kinds.filter(k => HIDE_KINDS.includes(k));
        const money = scan.kinds.includes('money request');
        const commit = () => { input.value = ''; sync(); P.chat.send(id, text); };
        if (!scan.hit) return commit();
        closeSheet = P.ui.sheet(`<h3>${money ? 'Careful with money' : 'Keep it in Padres'}</h3>
          ${money ? `<div class="msg-warn bad"><b>${P.icon('alert', 18)} Never send money to someone you met online</b>Scams often start with a small favour, a loan or an investment tip. Padres will never ask you to pay a match.</div>` : ''}
          ${masked.length ? `<div class="msg-warn"><b>${P.icon('lock', 18)} ${esc(masked.join(', '))} detected</b>Sharing numbers or handles early is how most scams start. Keep it in Padres until you trust each other. We will hide it if you send.</div>` : ''}
          <div class="stack"><button class="btn primary block" data-o="send">${masked.length ? 'Send without it' : 'Send anyway'}</button>
          <button class="btn block" data-o="edit">Edit</button></div>`, (sh, close) => {
          $('[data-o="send"]', sh).onclick = () => { close(); commit(); };
          $('[data-o="edit"]', sh).onclick = () => { close(); input.focus(); };
        });
      }
      sendBtn.onclick = doSend;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); doSend(); } });

      /* plus sheet */
      $('[data-plus]', el).onclick = () => {
        closeSheet = P.ui.sheet(`<h3>Share</h3><div class="list" style="margin-top:12px">
          <button class="item" data-a="meet"><span style="color:#34564D">${P.icon('calendar', 22)}</span><span class="t">Propose a meetup<span class="s">Pick a public place and time</span></span></button>
          ${parentOk() ? `<button class="item" data-a="play"><span style="color:#6E5A40">${P.icon('smile', 22)}</span><span class="t">Plan a playdate<span class="s">Kid-friendly public spot, parents only</span></span></button>` : ''}
          <button class="item" data-a="photo"><span style="color:#5B6B66">${P.icon('image', 22)}</span><span class="t">Send a photo</span></button>
          <button class="item" data-a="video"><span style="color:#34564D">${P.icon('camera', 22)}</span><span class="t">Video call</span></button></div>`, (sh, close) => {
          $$('[data-a]', sh).forEach(b => b.onclick = () => {
            const a = b.dataset.a; close();
            if (a === 'meet') P.openMeetup ? P.openMeetup(id, { playdate: false }) : P.ui.toast('Meetups are coming soon');
            else if (a === 'play') P.openMeetup ? P.openMeetup(id, { playdate: true }) : P.ui.toast('Playdates are coming soon');
            else if (a === 'photo') P.ui.toast('Photos unlock after 3 messages each');
            else P.ui.toast('Video calls are coming soon');
          });
        });
      };

      /* hold-to-record */
      let rec = null; const rt = $('[data-rt]', el);
      function endRec(send) {
        if (!rec) return; const r = rec; rec = null; clearInterval(r.t); timers.delete(r.t); comp.classList.remove('rec');
        const secs = Math.round((Date.now() - r.t0) / 1000);
        if (!send) return;
        if (secs < 1) { P.ui.toast('Hold the mic to record a voice note'); return; }
        P.chat.push(id, { from: 'me', kind: 'voice', text: 'Voice note', meta: { secs } }); P.chat.autoReply(id);
      }
      micBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); try { micBtn.setPointerCapture(e.pointerId); } catch (x) { }
        if (rec) return; comp.classList.add('rec'); rt.textContent = '0:00';
        const t0 = Date.now(), t = setInterval(() => { rt.textContent = mmss((Date.now() - t0) / 1000); }, 200);
        timers.add(t); rec = { t0, t };
      });
      micBtn.addEventListener('pointerup', () => endRec(true));
      micBtn.addEventListener('pointercancel', () => endRec(false));
      micBtn.addEventListener('contextmenu', (e) => e.preventDefault());

      return () => {
        offs.forEach(f => f()); timers.forEach(t => { clearTimeout(t); clearInterval(t); });
        Object.keys(voices).forEach(k => clearInterval(voices[k].t));
      };
    }
  };
})();

/* ===== screens/parents.js ===== */
(function () {
  'use strict';
  const { $, $$, esc } = P.util;

  /* ---------- parent card (lime glass) ---------- */
  function cardHtml(par) {
    const n = par.kidsCount || 0;
    const ages = (par.ages || []).map(a => `<span class="par-age">${esc(a)} yrs</span>`).join('');
    const about = par.about ? `<p class="par-about">&ldquo;${esc(par.about)}&rdquo;</p>` : '';
    return `<div class="par-card"><div class="par-card-h"><span class="par-ico">${P.icon('smile', 16, 2.2)}</span><b>Parent</b>${n ? `<span class="par-n">${n} ${n === 1 ? 'child' : 'children'}</span>` : ''}</div>${ages ? `<div class="par-ages">${ages}</div>` : ''}${about}</div>`;
  }
  P.parentsCard = (p) => {
    if (!p || !p.parent) return '';
    if (p.id === 'me') return p.parent.on ? cardHtml(p.parent) : '';
    const v = p.parent.visibility || 'matches';
    if (v === 'private') return '';
    if (v === 'matches' && !P.isMatch(p.id)) return '';

  };

  /* ---------- meetup / playdate sheet ---------- */
  const PLACES = {
    BD: { meet: ['Dhanmondi Lake, Rabindra Sarobar', 'Gulshan South Park', 'Bashundhara City food court'], play: ['Toggi Fun World, Bashundhara', 'Dhanmondi Lake, Rabindra Sarobar', 'Gulshan South Park'] },
    UK: { meet: ['Victoria Park, E9', 'Westfield Stratford', 'Mile End Park'], play: ['Mile End Park playground', 'Victoria Park, E9', 'Westfield Stratford'] }
  };
  const TIMES = [['10:00', '10:00 AM'], ['12:30', '12:30 PM'], ['16:00', '4:00 PM'], ['18:30', '6:30 PM']];
  const nextDow = (dow) => { const d = new Date(); d.setHours(0, 0, 0, 0); let add = (dow - d.getDay() + 7) % 7; if (add === 0) add = 7; d.setDate(d.getDate() + add); return d; };
  function dayOptions() {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const tm = new Date(t); tm.setDate(tm.getDate() + 1);
    return [['Today', t], ['Tomorrow', tm], ['Sat', nextDow(6)], ['Sun', nextDow(0)]];
  }

  P.openMeetup = (personId, opts) => {
    opts = opts || {};
    const p = P.person(personId); if (!p) return;
    const playdate = !!opts.playdate;
    const cc = p.country === 'UK' ? 'UK' : 'BD';
    const places = PLACES[cc][playdate ? 'play' : 'meet'];
    const days = dayOptions();
    const sel = { place: places[0], custom: '', day: 1, time: 2, other: false, note: '' };
    const now = new Date();
    const html = `<h3>${playdate ? 'Plan a playdate' : 'Suggest a meetup'}</h3>
      <p class="muted small" style="margin:0 0 4px">with ${esc(p.name)}${playdate ? ' &middot; kids welcome, public places only' : ''}</p>
      <div class="sec par-s">Where</div>
      <div class="chips" id="mpPlaces">${places.map((x, i) => `<button class="chip${i === 0 ? ' on' : ''}" data-pl="${esc(x)}">${P.icon('pin', 13, 2.4)} ${esc(x)}</button>`).join('')}<button class="chip" data-other>${P.icon('edit', 13, 2.4)} Somewhere else</button></div>
      <input class="input par-custom" id="mpCustom" maxlength="60" placeholder="Name a public place" hidden>
      <div class="sec par-s">Day</div>
      <div class="chips" id="mpDays">${days.map((d, i) => `<button class="chip${i === sel.day ? ' on' : ''}" data-d="${i}">${d[0]}</button>`).join('')}</div>
      <div class="sec par-s">Time</div>
      <div class="chips" id="mpTimes">${TIMES.map((t, i) => `<button class="chip${i === sel.time ? ' on' : ''}" data-t="${i}">${t[1]}</button>`).join('')}</div>
      <label class="field" style="margin:18px 0 0"><span>Add a note <i class="dim" style="font-style:normal">(optional)</i></span><input class="input" id="mpNote" maxlength="80" placeholder="${playdate ? 'Bringing snacks for the kids' : 'I will be in a green jacket'}"></label>
      <div class="par-tip">${P.icon('shieldCheck', 18)}<span>First meetups in public places. <b>Start a check-in timer</b> when you go, so your trusted contacts know you are safe.</span></div>
      <div class="row par-foot"><button class="btn" data-close>Cancel</button><button class="btn primary grow" id="mpSend">Send proposal</button></div>`;
    P.ui.sheet(html, (sh, close) => {
      const send = $('#mpSend', sh), custom = $('#mpCustom', sh);
      const place = () => sel.other ? P.safety.scan(custom.value.trim()).masked : sel.place;
      const refresh = () => { send.disabled = !place() || (sel.other && custom.value.trim().length < 3); };
      $$('[data-pl]', sh).forEach(b => b.onclick = () => { sel.other = false; sel.place = b.dataset.pl; custom.hidden = true; $$('#mpPlaces .chip', sh).forEach(c => c.classList.toggle('on', c === b)); refresh(); });
      $('[data-other]', sh).onclick = e => { sel.other = true; custom.hidden = false; custom.focus(); $$('#mpPlaces .chip', sh).forEach(c => c.classList.toggle('on', c === e.currentTarget)); refresh(); };
      custom.oninput = refresh;
      $$('[data-d]', sh).forEach(b => b.onclick = () => { sel.day = +b.dataset.d; $$('#mpDays .chip', sh).forEach(c => c.classList.toggle('on', c === b)); });
      $$('[data-t]', sh).forEach(b => b.onclick = () => { sel.time = +b.dataset.t; $$('#mpTimes .chip', sh).forEach(c => c.classList.toggle('on', c === b)); });
      send.onclick = () => {
        const [hh, mm] = TIMES[sel.time][0].split(':').map(Number);
        const when = new Date(days[sel.day][1]); when.setHours(hh, mm, 0, 0);
        if (when.getTime() < Date.now()) { P.ui.toast('That time has passed. Pick a later one.', 'warn'); return; }
        const note = P.safety.scan($('#mpNote', sh).value.trim()).masked;
        P.chat.push(personId, { from: 'me', kind: 'meetup', text: playdate ? 'Playdate proposal' : 'Meetup proposal', meta: { place: place(), when: when.toISOString(), note, playdate } });
        P.ui.toast((playdate ? 'Playdate' : 'Meetup') + ' proposal sent to ' + p.name, 'good');
        close();
        P.chat.autoReply(personId);
      };
      refresh();
    });
  };

  /* ---------- Parents screen ---------- */
  P.screens.parents = {
    tab: 'me',
    render(el) {
      const u = P.state.user;
      if (!u.parent) u.parent = { on: false, kidsCount: 1, ages: [], about: '', visibility: 'matches' };
      const par = u.parent;
      const off = [];
      const draw = () => {
        el.innerHTML = P.ui.topbar('Parents', { back: true }) + `<div class="scroll-y par-scroll">
          <div class="card par-toggle ${par.on ? 'on' : ''}"><div class="row"><span class="par-big">${P.icon('smile', 24, 2)}</span>
            <div class="grow"><b>I'm a parent</b><div class="small muted">${par.on ? 'Parent badge and tools are on.' : 'Optional. Off by default.'}</div></div>${P.ui.switchHtml('parOn', par.on, "I'm a parent")}</div></div>
          ${par.on ? onView() : offView()}</div>`;
        $$('[data-back]', el).forEach(b => b.onclick = () => P.back());
        $('#parOn', el).onchange = e => {
          par.on = e.target.checked; P.save();

      function offView() {
        const items = [['smile', 'Parent badge', 'A Parent badge so other parents spot you.', 'lime'], ['filter', 'Parents filter', 'Show only parents in Friends and Date.', 'cyan'], ['users', 'Parent circles', 'Local groups like Dhanmondi Parents and London Bangladeshi Parents.', 'violet'], ['calendar', 'Playdate cards', 'Suggest a public place and time in any chat.', 'pink']];
        return `<div class="par-hero"><h1 class="h-display">Meet <span class="grad-text">parents</span> who get it</h1>
          <p class="muted">Turn this on only if you want it. It is completely opt-in.</p></div>
          <div class="par-benefits">${items.map(i => `<div class="par-b ${i[3]}"><span class="ico">${P.icon(i[0], 22)}</span><div><b>${i[1]}</b><span>${i[2]}</span></div></div>`).join('')}</div>
          <div class="par-quiet">${P.icon('eyeOff', 18)}<span>While this is off, <b>nothing parent-related shows</b> on your profile or in your feed.</span></div>
          <button class="btn primary block par-cta" id="parGo">Turn on Parents</button>
          <p class="small dim" style="text-align:center;margin:12px 0 0">No children's photos or names are ever needed.</p>`;

      function previewCard(who) {

        return `<div class="par-pv"><div class="par-pv-h">${who === 'match' ? 'A match sees' : 'A stranger sees'}</div>

      }

      }
      function bind() {
        $$('[data-pick]', body).forEach(b => b.onclick = () => pick(b.dataset.pick));
        const a = $('#plAct', body); if (a) a.onclick = () => { if (P.plan.activateGlobal()) { P.ui.toast('Global access active for 24 hours', 'good'); draw(); } };
        const y = $('#plBuy', body); if (y) y.onclick = () => { if (P.plan.buyPass()) { P.ui.toast('Global Pass added (demo, no payment taken)', 'good'); draw(); } };
        $$('[data-lb]', body).forEach(b => b.onclick = () => {
          const id = b.dataset.lb, r = P.like(id, P.state.mode);
          if (!r.ok) return P.openPaywall(r.reason === 'super' ? 'super' : 'swipes');
          const p = P.person(id); P.ui.toast(r.matched ? 'It\'s a match with ' + (p ? p.name : 'them') + '!' : 'Liked ' + (p ? p.name : ''), 'good'); draw();
        });
      }
      async function pick(id) {
        const cur = P.state.plan; if (id === cur) return;
        const L = LB()[id], down = ORDER.indexOf(id) < ORDER.indexOf(cur);
        const txt = id === 'free' ? 'You will go back to ' + LB().free.swipes + ' swipes a day and lose paid features. Demo — no payment taken.'
          : `${P.plan.price(id)} per month. Demo — no payment taken.`;
        const ok = await P.ui.confirm((down ? 'Downgrade to ' : 'Switch to ') + L.label + '?', txt, down ? 'Downgrade' : 'Choose ' + L.label, down && id === 'free');
        if (!ok) return;
        P.plan.setPlan(id); P.ui.toast(down ? 'Moved to ' + L.label : 'Welcome to ' + L.label + '!', 'good');
      }
      draw();
      const t = setInterval(() => { $$('[data-cd="g"]', body).forEach(n => n.textContent = fmt(P.state.global.activeUntil - Date.now())); if (P.state.global.activeUntil && !P.plan.globalActive() && $('[data-cd="g"]', body)) draw(); }, 1000);
      return () => { clearInterval(t); off1(); };
    }
  };

  /* ================= PAYWALL ================= */
  const REASONS = {
    swipes: { icon: 'heart', title: "You're out of swipes for today", text: 'Daily swipes keep Padres thoughtful.', cmp: p => [['Swipes / day', LB()[p].swipes]] },
    super: { icon: 'star', title: 'No super-likes left today', text: 'Stand out with more super-likes every day.', cmp: p => [['Super-likes / day', LB()[p].supers]] },
    filters: { icon: 'sliders', title: 'Advanced filters', text: 'Filter by interests, parents and verified-only to find your people faster.', cmp: p => [['Advanced filters', LB()[p].filters ? 'Included' : '—']] },
    global: { icon: 'globe', title: 'Global Pass', get text() { const nb = (x) => x.replace(' ', '\u00a0'); return `Premium members pay ${nb(passPrice('premium'))} instead of ${nb(passPrice('free'))} per pass. Match outside ${placeName()} for 24 hours at a time.`; }, cmp: p => [['Global days included', inclText(p)], ['Extra pass price', passPrice(p)]] },
    boost: { icon: 'zap', title: 'Boost your profile', text: 'Be seen first by more people for 30 minutes.', cmp: p => [['Boosts / month', LB()[p].boosts || '—']] },
    likes: { icon: 'eye', title: 'See who liked you', text: 'Skip the guessing. Like back instantly and match.', cmp: p => [['See who liked you', LB()[p].seeLikes ? 'Included' : '—']] },
    incognito: { icon: 'eyeOff', title: 'Incognito mode', text: 'Browse privately — only people you like can see you.', cmp: p => [['Incognito', p === 'premium' ? 'Included' : '—']] }
  };
  P.openPaywall = function (reason) {
    const R = REASONS[reason] || REASONS.likes, cur = P.state.plan;
    let nx = nextTier(cur);
    if (reason === 'likes' || reason === 'incognito' || reason === 'global') nx = cur === 'premium' ? null : 'premium';
    const isSwipes = reason === 'swipes', isGlobal = reason === 'global';
    let title = R.title, text = R.text, tail = '';
    if (!nx) {
      if (isSwipes) { title = "You've used today's swipes"; text = 'Even on Premium the daily limit protects quality, so every swipe is a real choice. Fresh swipes arrive after the reset.'; }
      else if (isGlobal) { title = 'Global Pass'; text = `Premium includes ${inclText('premium')} a month, and extra passes cost just ${passPrice('premium')} each.`; }
      else { title = 'You have the top plan'; text = 'Premium already includes this. Your allowance refreshes on the usual schedule.'; }
    }
    const rows = nx ? R.cmp(cur).map((r, i) => `<div class="pl-cmp"><span>${r[0]}</span><span class="pl-from">${esc(r[1])}</span>${P.icon('chev', 14)}<b class="pl-to">${esc(R.cmp(nx)[i][1])}</b></div>`).join('') : '';
    const sh = P.ui.sheet(`<div class="pl-pw"><span class="pl-pwi">${P.icon(R.icon, 26)}</span><h3>${esc(title)}</h3><p class="muted" style="margin:6px 0 0">${esc(text)}</p>
      ${isSwipes ? `<div class="pl-reset">${P.icon('clock', 16)} Resets in <b data-cd="r">${fmt(P.plan.msToReset())}</b></div>` : ''}
      ${nx ? `<div class="pl-rec"><div class="row between"><div><span class="badge plan">${P.icon('crown', 11, 2.5)} ${esc(LB()[nx].label)}</span><div class="small muted" style="margin-top:6px">Recommended for you</div></div><div class="pl-rp">${esc(P.plan.price(nx))}<small>/mo</small></div></div>${rows}</div>` : ''}
      <div class="stack" style="margin-top:18px">${nx ? `<button class="btn primary block" id="plSee">See plans</button>` : ''}${isGlobal ? `<button class="btn block ${nx ? '' : 'primary'}" id="plPass">Buy one pass · ${esc(passPrice())}</button>` : ''}${nx ? `<button class="btn block ghost" data-close>Not now</button>` : isGlobal ? '<button class="btn block ghost" data-close>Close</button>' : '<button class="btn block" data-close>Got it</button>'}</div></div>`,
      (s, close) => {
        const b = $('#plSee', s); if (b) b.onclick = () => { close(); P.go('plans'); };
        const y = $('#plPass', s); if (y) y.onclick = () => { if (P.plan.buyPass()) { close(); P.ui.toast('Global Pass added (demo, no payment taken)', 'good'); } };
      });
    if (isSwipes) {
      const t = setInterval(() => { const n = document.querySelector('.sheet [data-cd="r"]'); if (!n) return clearInterval(t); n.textContent = fmt(P.plan.msToReset()); }, 1000);
    }
    return sh;
  };
})();

P.boot();
</script></body></html>
